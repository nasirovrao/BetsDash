<section>
  <div class="wrap">
    <div class="section-head">
      <h2>Ставки</h2>
      <div class="section-note" id="countNote"></div>
    </div>

    <div class="channel-switch" id="channelSwitch">
      <a class="channel-pill" data-channel="default" href="app.html?channel=default">Личный дневник</a>
      <a class="channel-pill" data-channel="cybervalue" href="app.html?channel=cybervalue">Cybervalue</a>
    </div>

    <div class="bet-form" id="betFormBlock">
      <h3 id="betFormHeading">Добавить ставку</h3>
      <form id="betForm">
        <input type="hidden" id="f_editId" value="">
        <div class="express-toggle-row">
          <label class="express-toggle">
            <input type="checkbox" id="f_isExpress">
            <span>Это экспресс — несколько событий одной ставкой</span>
          </label>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="f_date">Дата</label>
            <input id="f_date" type="date" required>
          </div>
          <div class="field">
            <label for="f_discipline">Дисциплина</label>
            <select id="f_discipline" required>
              <option value="Dota2">Dota2</option>
              <option value="CS2">CS2</option>
              <option value="Hockey">Hockey</option>
              <option value="Other">Другое</option>
            </select>
          </div>
          <div class="field">
            <label for="f_bookmaker">Букмекер</label>
            <input id="f_bookmaker" type="text" placeholder="Pinnacle" list="bookmakerList" required autocomplete="off">
            <datalist id="bookmakerList"></datalist>
          </div>
          <div class="field">
            <label for="f_tournament">Турнир</label>
            <input id="f_tournament" type="text" placeholder="Esports World Cup">
          </div>
          <div class="field" id="f_matchField">
            <label for="f_match">Матч</label>
            <input id="f_match" type="text" placeholder="Spirit vs MOUZ">
          </div>
          <div class="field" id="f_pickField">
            <label for="f_pick">Пик</label>
            <input id="f_pick" type="text" placeholder="Spirit 1x2 — Map 1" required>
          </div>
          <div class="field" id="expressLegsBlock" style="grid-column: 1 / -1; display:none;">
            <label>Ноги экспресса</label>
            <div id="expressLegsList" class="express-legs-list"></div>
            <button type="button" class="btn btn-ghost" id="addLegBtn" style="width:auto; margin-top:10px;">+ Добавить ногу</button>
          </div>
          <div class="field">
            <label for="f_odds">Кэф</label>
            <input id="f_odds" type="number" step="0.001" min="1.01" required>
          </div>
          <div class="field">
            <label for="f_flat">Флет (×)</label>
            <input id="f_flat" type="number" step="0.01" min="0.01" value="1" required>
          </div>
          <div class="field">
            <label for="f_stake">Сумма ($)</label>
            <input id="f_stake" type="number" step="0.01" min="0.01" required>
          </div>
          <div class="field">
            <label for="f_result">Результат</label>
            <select id="f_result">
              <option value="Pending">Pending</option>
              <option value="Win">Win</option>
              <option value="Loss">Loss</option>
              <option value="Push">Push</option>
              <option value="Sold">Продана (кэшаут)</option>
            </select>
          </div>
          <div class="field" id="f_manualProfitField" style="display:none;">
            <label for="f_manualProfit">Профит от продажи ($)</label>
            <input id="f_manualProfit" type="number" step="0.01" placeholder="можно отрицательный">
          </div>
          <div class="field">
            <label for="f_type">Тип ставки</label>
            <select id="f_type">
              <option value="">—</option>
              <option value="Pre">Pre</option>
              <option value="Live">Live</option>
              <option value="Хедж">Хедж</option>
            </select>
          </div>
          <div class="field">
            <label for="f_conviction">Уверенность</label>
            <select id="f_conviction">
              <option value="">—</option>
              <option value="1">★</option>
              <option value="2">★★</option>
              <option value="3">★★★</option>
            </select>
          </div>
          <div class="field">
            <label for="f_edge">Эдж-паттерн (метка)</label>
            <input id="f_edge" type="text" placeholder="например: closing-value-cs2" list="edgeList" autocomplete="off">
            <datalist id="edgeList"></datalist>
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label for="f_notes">Заметка (необязательно)</label>
            <input id="f_notes" type="text" placeholder="контекст, который стоит запомнить об этой ставке">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit" id="addBtn" style="width:auto;">Добавить ставку</button>
          <button class="btn btn-ghost" type="button" id="cancelEditBtn" style="width:auto; display:none;">Отмена</button>
          <span class="form-status" id="formStatus"></span>
        </div>
      </form>
    </div>

    <div class="feed-filters" id="feedFilters">
      <input type="text" id="filterSearch" class="filter-search" placeholder="Поиск по матчу или пику…" autocomplete="off">
      <select id="filterDiscipline"><option value="">Все дисциплины</option></select>
      <select id="filterBookmaker"><option value="">Все букмекеры</option></select>
      <select id="filterTournament"><option value="">Все турниры</option></select>
      <select id="filterResult">
        <option value="">Любой результат</option>
        <option value="Win">Win</option>
        <option value="Loss">Loss</option>
        <option value="Push">Push</option>
        <option value="Pending">Pending</option>
        <option value="Sold">Продана</option>
      </select>
      <button type="button" class="filter-reset" id="filterResetBtn" style="display:none;">Сбросить</button>
      <span class="filter-count" id="filterCount"></span>
    </div>

    <div id="betFeed" class="bet-feed"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Пока нет ни одной ставки — добавь первую формой выше.</div>
    <div class="empty-state" id="filterEmptyState" style="display:none;">Под такие фильтры ставок не нашлось. <a id="clearFiltersLink" href="#">Сбросить фильтры</a></div>
  </div>
</section>

<script type="module">
  import { supabase, requireSession, isClvEnabled } from './supabase-client.js';
  import { computeProfit, fmtMoney } from './lib.js';

  const session = await requireSession();
  if (session) {
    document.getElementById('userEmail').textContent = session.user.email;
  }
  isClvEnabled().then(on => { if (on) document.getElementById('navClvPill').style.display = ''; });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  // Личный дневник и канал Cybervalue — два независимых набора ставок в
  // одном аккаунте (см. schema_milestone8.sql), переключаются прямо в URL
  // (?channel=cybervalue), поэтому оба режима можно держать открытыми
  // одновременно в двух вкладках браузера.
  const activeChannel = new URLSearchParams(location.search).get('channel') === 'cybervalue' ? 'cybervalue' : 'default';
  document.querySelectorAll('#channelSwitch .channel-pill').forEach(a => {
    a.classList.toggle('active', a.dataset.channel === activeChannel);
  });

  const betFeed = document.getElementById('betFeed');
  const emptyState = document.getElementById('emptyState');
  const countNote = document.getElementById('countNote');
  const formStatus = document.getElementById('formStatus');
  const bookmakerList = document.getElementById('bookmakerList');
  const edgeList = document.getElementById('edgeList');
  const betForm = document.getElementById('betForm');
  const betFormBlock = document.getElementById('betFormBlock');
  const betFormHeading = document.getElementById('betFormHeading');
  const addBtn = document.getElementById('addBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const editIdField = document.getElementById('f_editId');
  const resultSelect = document.getElementById('f_result');
  const manualProfitField = document.getElementById('f_manualProfitField');
  const manualProfitInput = document.getElementById('f_manualProfit');
  const filterSearch = document.getElementById('filterSearch');
  const filterDiscipline = document.getElementById('filterDiscipline');
  const filterBookmaker = document.getElementById('filterBookmaker');
  const filterTournament = document.getElementById('filterTournament');
  const filterResult = document.getElementById('filterResult');
  const filterResetBtn = document.getElementById('filterResetBtn');
  const filterCount = document.getElementById('filterCount');
  const filterEmptyState = document.getElementById('filterEmptyState');
  const clearFiltersLink = document.getElementById('clearFiltersLink');
  const isExpressCheckbox = document.getElementById('f_isExpress');
  const matchField = document.getElementById('f_matchField');
  const pickField = document.getElementById('f_pickField');
  const pickInput = document.getElementById('f_pick');
  const oddsInput = document.getElementById('f_odds');
  const expressLegsBlock = document.getElementById('expressLegsBlock');
  const expressLegsList = document.getElementById('expressLegsList');
  const addLegBtn = document.getElementById('addLegBtn');

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // "Сегодня" по МЕСТНОМУ времени пользователя, а не по UTC: input.valueAsDate
  // трактует Date как UTC-полночь, из-за чего для часовых поясов восточнее UTC
  // (например, Москва) в первые часы после полуночи по местному времени поле
  // подставляло вчерашнюю дату — ставка могла случайно уйти не тем днём.
  function todayLocalStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function fmtDate(d){
    const [y,m,day] = d.split('-');
    return `${day}.${m}.${y}`;
  }
  const MONTH_NAMES = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  function monthLabel(d){
    const [y, m] = d.split('-');
    return `${MONTH_NAMES[Number(m) - 1]} ${y}`;
  }
  function resPillClass(r){
    return { Win:'win', Loss:'loss', Push:'push', Pending:'pending', Sold:'sold' }[r] || 'pending';
  }

  // Экспресс из нескольких событий: "Экспресс (2 события): нога1 + нога2" —
  // разбиваем на отдельные ноги вместо одной длинной нечитаемой строки.
  function parseExpressLegs(pick){
    const m = String(pick || '').match(/^Экспресс\s*\(([^)]+)\)\s*:\s*([\s\S]*)$/i);
    if (!m) return null;
    const legs = m[2].split(/\s*\+\s*/).map(s => s.trim()).filter(Boolean);
    return { count: m[1], legs };
  }

  // "победа/победы/побед" — русское склонение числительных для подписи "N событий".
  function ruCount(n, one, few, many){
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return few;
    return many;
  }

  // Конструктор ног экспресса в форме ставки. Каждая нога — своё описание и
  // свой кэф; итоговый кэф (#f_odds) считается автоматически как произведение
  // кэфов ног и не редактируется руками, пока включён режим "Экспресс".
  // При сохранении ноги собираются обратно в один текст в поле "Пик" в формате
  // "Экспресс (N событий): нога1 @1.85 + нога2 @1.42 + ..." — том же, что уже
  // умеет показывать cardTitleAndBody() построчно.
  function makeLegRow(text, odds){
    const row = document.createElement('div');
    row.className = 'express-leg-row';
    row.innerHTML = `
      <input type="text" class="leg-input leg-text-input" placeholder="например: Spirit — победа (карта 1)" required>
      <input type="number" class="leg-input leg-odds-input" step="0.001" min="1.01" placeholder="Кэф" required>
      <button type="button" class="leg-remove-btn" title="Убрать ногу">✕</button>
    `;
    row.querySelector('.leg-text-input').value = text || '';
    row.querySelector('.leg-odds-input').value = odds != null ? odds : '';
    row.querySelector('.leg-odds-input').addEventListener('input', recomputeExpressOdds);
    row.querySelector('.leg-remove-btn').addEventListener('click', () => {
      if (expressLegsList.children.length <= 2) return; // минимум 2 ноги в экспрессе
      row.remove();
      updateLegRemoveButtons();
      recomputeExpressOdds();
    });
    return row;
  }

  function updateLegRemoveButtons(){
    const rows = expressLegsList.querySelectorAll('.express-leg-row');
    rows.forEach(r => { r.querySelector('.leg-remove-btn').disabled = rows.length <= 2; });
  }

  function addLegRow(text, odds){
    expressLegsList.appendChild(makeLegRow(text, odds));
    updateLegRemoveButtons();
  }

  function clearExpressLegs(){
    expressLegsList.innerHTML = '';
  }

  function populateExpressLegs(legs){
    clearExpressLegs();
    (legs.length ? legs : [{}, {}]).forEach(l => addLegRow(l.text, l.odds));
    if (expressLegsList.children.length < 2) addLegRow();
    recomputeExpressOdds();
  }

  // Итоговый кэф = произведение кэфов всех ног. Пока не заполнены ХОТЯ БЫ
  // 2 ноги валидным кэфом (>1) — поле остаётся пустым, чтобы не сохранить
  // случайно неполный экспресс с неверным итоговым кэфом.
  function recomputeExpressOdds(){
    const values = Array.from(expressLegsList.querySelectorAll('.leg-odds-input')).map(i => Number(i.value));
    const allValid = values.length >= 2 && values.every(v => v > 1);
    oddsInput.value = allValid ? values.reduce((a, b) => a * b, 1).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') : '';
  }

  function setExpressMode(on){
    isExpressCheckbox.checked = on;
    matchField.style.display = on ? 'none' : '';
    pickField.style.display = on ? 'none' : '';
    expressLegsBlock.style.display = on ? '' : 'none';
    pickInput.required = !on;
    oddsInput.readOnly = on;
  }

  addLegBtn.addEventListener('click', () => addLegRow());

  isExpressCheckbox.addEventListener('change', () => {
    const on = isExpressCheckbox.checked;
    setExpressMode(on);
    if (on) {
      populateExpressLegs([]);
    } else {
      clearExpressLegs();
      oddsInput.value = '';
    }
  });

  // Разбирает одну ногу вида "текст @1.85" обратно на {text, odds} — нужно,
  // чтобы при редактировании уже сохранённого экспресса заново заполнить
  // конструктор. Если "@кэф" в тексте не найдено (старая запись, где ноги
  // вписаны вручную без явного кэфа) — просто оставляем кэф пустым, пользователь
  // впишет его сам; поле обязательное, так что сохранить с пустым кэфом не выйдет.
  function splitLegTextOdds(raw){
    const m = String(raw).match(/^(.*?)\s*@\s*([\d.]+)\s*$/);
    if (m) return { text: m[1].trim(), odds: Number(m[2]) };
    return { text: String(raw).trim(), odds: null };
  }

  // Заголовок + тело карточки: используем "Матч" когда он указан; для экспрессов —
  // короткий заголовок с разбивкой по ногам. Если "Матч" не указан — заголовком
  // НЕ становятся имена из "(Дуэль X vs Y, ...)" в тексте пика: это игроки внутри
  // конкретной карты/дуэли, а не сам матч, и раньше это приводило к неверным
  // заголовкам (например "r1nkle vs Lake" вместо настоящего матча "G2 - M80").
  // Вместо этого показываем пик как есть и даём кнопку "+ добавить матч",
  // чтобы вписать правильное название вручную прямо в карточке.
  function cardTitleAndBody(bet){
    const express = parseExpressLegs(bet.pick);
    if (express) {
      return {
        title: `Экспресс (${escapeHtml(express.count)})`,
        bodyHtml: express.legs.map(l => `<div class="bet-leg">${escapeHtml(l)}</div>`).join(''),
        hasMatch: true,
      };
    }
    if (bet.match) {
      return { title: escapeHtml(bet.match), bodyHtml: `<div class="bet-card-sub">${escapeHtml(bet.pick)}</div>`, hasMatch: true };
    }
    return { title: null, bodyHtml: `<div class="bet-card-sub">${escapeHtml(bet.pick)}</div>`, hasMatch: false };
  }

  // Для Pending-ставок вместо статичного пилла — выпадающий список, чтобы можно
  // было проставить результат руками, когда матч отыгран, без пересоздания ставки.
  function resultCellHtml(bet){
    if (bet.result !== 'Pending') {
      return `<span class="bet-stat-label">Результат</span><span class="res-pill ${resPillClass(bet.result)}">${bet.result}</span>`;
    }
    return `
      <span class="bet-stat-label">Результат</span>
      <select class="pending-select" data-id="${bet.id}">
        <option value="" selected disabled>Pending</option>
        <option value="Win">Win</option>
        <option value="Loss">Loss</option>
        <option value="Push">Push</option>
        <option value="Sold">Продана</option>
      </select>
    `;
  }

  function wirePendingControl(cardEl, bet){
    const select = cardEl.querySelector('.pending-select');
    if (!select) return;
    select.addEventListener('change', async () => {
      const val = select.value;
      if (!val) return;
      if (val === 'Sold') {
        showSoldMiniForm(cardEl, bet.id);
        return;
      }
      select.disabled = true;
      const ok = await updateBetResult(bet.id, val, null);
      if (ok) loadBets(); else select.disabled = false;
    });
  }

  function showSoldMiniForm(cardEl, id){
    const cell = cardEl.querySelector('.pending-result-stat');
    cell.innerHTML = `
      <span class="bet-stat-label">Профит от продажи</span>
      <div class="mini-sold-row">
        <input type="number" step="0.01" class="mini-profit-input" placeholder="$">
        <button type="button" class="mini-confirm-btn" title="Сохранить">✓</button>
      </div>
    `;
    const input = cell.querySelector('.mini-profit-input');
    input.focus();
    cell.querySelector('.mini-confirm-btn').addEventListener('click', async () => {
      if (input.value === '') { input.focus(); return; }
      const ok = await updateBetResult(id, 'Sold', Number(input.value));
      if (ok) loadBets();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); cell.querySelector('.mini-confirm-btn').click(); }
    });
  }

  async function updateBetResult(id, result, manualProfit){
    const payload = { result };
    if (result === 'Sold') payload.manual_profit = manualProfit;
    const { error } = await supabase.from('bets').update(payload).eq('id', id);
    if (error) {
      formStatus.textContent = 'Не удалось обновить результат: ' + error.message;
      return false;
    }
    formStatus.textContent = '';
    return true;
  }

  function renderCard(bet){
    const div = document.createElement('div');
    div.className = 'bet-card';
    const profit = computeProfit(bet);
    const profitCls = profit == null ? '' : profit > 0 ? 'pos-text' : profit < 0 ? 'neg-text' : '';
    const { title, bodyHtml, hasMatch } = cardTitleAndBody(bet);
    div.innerHTML = `
      <div class="bet-card-main">
        <div class="bet-card-title-wrap">${hasMatch ? `<div class="bet-card-title">${title}</div>` : `<button type="button" class="match-add-btn">+ добавить матч</button>`}</div>
        ${bodyHtml}
        <div class="bet-card-meta">
          <span class="meta-chip">${escapeHtml(bet.discipline)}</span>
          <span class="meta-chip">${escapeHtml(bet.bookmaker)}</span>
          ${bet.tournament ? `<span class="meta-chip">${escapeHtml(bet.tournament)}</span>` : ''}
          ${bet.edge_tag ? `<span class="tag-chip">${escapeHtml(bet.edge_tag)}</span>` : ''}
          <span class="meta-date">${fmtDate(bet.bet_date)}</span>
          <button type="button" class="note-toggle${bet.notes ? '' : ' add'}">${bet.notes ? '📝 заметка' : '+ заметка'}</button>
        </div>
        <div class="bet-card-note-wrap" style="display:none;"></div>
      </div>
      <div class="bet-card-stats">
        <div class="bet-stat"><span class="bet-stat-label">Кэф</span><span class="bet-stat-value">${Number(bet.odds).toFixed(2)}</span></div>
        <div class="bet-stat"><span class="bet-stat-label">Флет</span><span class="bet-stat-value">${Number(bet.flat_mult).toFixed(2)}×</span></div>
        <div class="bet-stat"><span class="bet-stat-label">Сумма</span><span class="bet-stat-value">$${Number(bet.stake).toFixed(2)}</span></div>
        <div class="bet-stat pending-result-stat">${resultCellHtml(bet)}</div>
        <div class="bet-stat"><span class="bet-stat-label">Профит</span><span class="bet-stat-value ${profitCls}">${profit == null ? '—' : fmtMoney(profit)}</span></div>
      </div>
      <div class="bet-card-actions">
        <button class="bet-card-edit" data-id="${bet.id}" title="Редактировать ставку">✎</button>
        <button class="bet-card-del" data-id="${bet.id}" title="Удалить ставку">✕</button>
      </div>
    `;
    div.querySelector('.bet-card-edit').addEventListener('click', () => enterEditMode(bet));
    div.querySelector('.bet-card-del').addEventListener('click', () => deleteBet(bet.id, bet.match || bet.pick));
    if (bet.result === 'Pending') wirePendingControl(div, bet);
    wireNoteControl(div, bet);
    if (!hasMatch) wireMatchControl(div, bet);
    return div;
  }

  // Для ставок без "Матч" в данных — клик по "+ добавить матч" открывает
  // текстовое поле прямо в карточке; сохраняем в bets.match без перезагрузки.
  function wireMatchControl(cardEl, bet){
    const wrap = cardEl.querySelector('.bet-card-title-wrap');
    if (!wrap) return;

    function showButton(){
      wrap.innerHTML = `<button type="button" class="match-add-btn">+ добавить матч</button>`;
      wrap.querySelector('.match-add-btn').addEventListener('click', showEdit);
    }

    function showTitle(val){
      wrap.innerHTML = `<div class="bet-card-title">${escapeHtml(val)}</div>`;
    }

    function showEdit(){
      wrap.innerHTML = `
        <div class="match-edit-row">
          <input type="text" class="match-input" placeholder="например: G2 Esports vs M80" value="${escapeHtml(bet.match || '')}">
          <button type="button" class="match-save-btn" title="Сохранить">✓</button>
          <button type="button" class="match-cancel-btn" title="Отмена">✕</button>
        </div>
      `;
      const input = wrap.querySelector('.match-input');
      input.focus();

      async function save(){
        const val = input.value.trim();
        if (!val) { input.focus(); return; }
        const { error } = await supabase.from('bets').update({ match: val }).eq('id', bet.id);
        if (error) { formStatus.textContent = 'Не удалось сохранить матч: ' + error.message; return; }
        bet.match = val;
        showTitle(val);
      }

      wrap.querySelector('.match-save-btn').addEventListener('click', save);
      wrap.querySelector('.match-cancel-btn').addEventListener('click', () => {
        bet.match ? showTitle(bet.match) : showButton();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); save(); }
      });
    }

    wrap.querySelector('.match-add-btn').addEventListener('click', showEdit);
  }

  // Заметка скрыта по умолчанию (карточки не растягиваются длинным текстом),
  // разворачивается по клику на чип и редактируется прямо там же —
  // без отдельной страницы и без пересоздания ставки.
  function wireNoteControl(cardEl, bet){
    const toggleBtn = cardEl.querySelector('.note-toggle');
    const wrap = cardEl.querySelector('.bet-card-note-wrap');
    if (!toggleBtn || !wrap) return;

    function setToggleLabel(){
      toggleBtn.classList.toggle('add', !bet.notes);
      toggleBtn.textContent = bet.notes ? '📝 заметка' : '+ заметка';
    }

    function showRead(){
      wrap.innerHTML = `
        <div class="bet-card-note">${escapeHtml(bet.notes)}</div>
        <button type="button" class="note-edit-btn">Изменить</button>
      `;
      wrap.querySelector('.note-edit-btn').addEventListener('click', showEdit);
    }

    function collapse(){
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      expanded = false;
    }

    function showEdit(){
      wrap.innerHTML = `
        <textarea class="note-textarea" placeholder="контекст, который стоит запомнить об этой ставке">${escapeHtml(bet.notes || '')}</textarea>
        <div class="note-actions">
          <button type="button" class="note-save-btn">Сохранить</button>
          <button type="button" class="note-cancel-btn">Отмена</button>
        </div>
      `;
      const textarea = wrap.querySelector('.note-textarea');
      textarea.focus();
      wrap.querySelector('.note-save-btn').addEventListener('click', async () => {
        const val = textarea.value.trim();
        const { error } = await supabase.from('bets').update({ notes: val || null }).eq('id', bet.id);
        if (error) { formStatus.textContent = 'Не удалось сохранить заметку: ' + error.message; return; }
        bet.notes = val || null;
        setToggleLabel();
        if (bet.notes) showRead(); else collapse();
      });
      wrap.querySelector('.note-cancel-btn').addEventListener('click', () => {
        if (bet.notes) showRead(); else collapse();
      });
    }

    let expanded = false;
    toggleBtn.addEventListener('click', () => {
      expanded = !expanded;
      if (!expanded) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      if (bet.notes) showRead(); else showEdit();
    });
  }

  // Ставки уже приходят отсортированными по дате (свежие сверху) — разбиваем
  // на секции по месяцу. Каждый месяц можно свернуть/развернуть — по умолчанию
  // открыт только самый свежий, остальные свёрнуты, чтобы при большом числе
  // ставок (а у нескольких пользователей их будет много) лента не превращалась
  // в бесконечный скролл. Ручной выбор пользователя (что он сам свернул или
  // развернул) запоминается на время сессии и переживает смену фильтров.
  const monthToggleState = new Map(); // label -> true (развёрнут) | false (свёрнут)
  function isMonthExpanded(label, index){
    if (monthToggleState.has(label)) return monthToggleState.get(label);
    return index === 0;
  }

  function renderFeed(data){
    betFeed.innerHTML = '';
    const groups = [];
    let currentMonth = null, currentList = null;
    data.forEach(bet => {
      const label = monthLabel(bet.bet_date);
      if (label !== currentMonth) {
        currentMonth = label;
        currentList = [];
        groups.push({ label, list: currentList });
      }
      currentList.push(bet);
    });

    groups.forEach((g, i) => {
      const expanded = isMonthExpanded(g.label, i);
      const group = document.createElement('div');
      group.className = 'month-group';
      group.innerHTML = `
        <button type="button" class="month-header${expanded ? '' : ' collapsed'}">
          <span class="month-header-label">${g.label.toUpperCase()}</span>
          <span class="month-header-count">${g.list.length}</span>
          <span class="month-header-chevron">›</span>
        </button>
        <div class="month-cards" style="${expanded ? '' : 'display:none;'}"></div>
      `;
      const cardsWrap = group.querySelector('.month-cards');
      g.list.forEach(bet => cardsWrap.appendChild(renderCard(bet)));
      const headerBtn = group.querySelector('.month-header');
      headerBtn.addEventListener('click', () => {
        const nowExpanded = cardsWrap.style.display === 'none';
        cardsWrap.style.display = nowExpanded ? '' : 'none';
        headerBtn.classList.toggle('collapsed', !nowExpanded);
        monthToggleState.set(g.label, nowExpanded);
      });
      betFeed.appendChild(group);
    });
  }

  // Все ставки пользователя держим в памяти и фильтруем на клиенте — датасет
  // одного человека не настолько большой, чтобы гонять запрос на каждый чих,
  // а фильтры при этом ощущаются мгновенными.
  let allBets = [];

  function fillFilterSelect(selectEl, values){
    const current = selectEl.value;
    const firstOption = selectEl.querySelector('option');
    selectEl.innerHTML = '';
    selectEl.appendChild(firstOption);
    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      selectEl.appendChild(opt);
    });
    if (values.includes(current)) selectEl.value = current;
  }

  function populateFilterOptions(data){
    fillFilterSelect(filterDiscipline, Array.from(new Set(data.map(b => b.discipline).filter(Boolean))).sort());
    fillFilterSelect(filterBookmaker, Array.from(new Set(data.map(b => b.bookmaker).filter(Boolean))).sort());
    fillFilterSelect(filterTournament, Array.from(new Set(data.map(b => b.tournament).filter(Boolean))).sort());
  }

  function applyFilters(){
    const q = filterSearch.value.trim().toLowerCase();
    const disc = filterDiscipline.value;
    const bk = filterBookmaker.value;
    const trn = filterTournament.value;
    const res = filterResult.value;

    const filtered = allBets.filter(b => {
      if (disc && b.discipline !== disc) return false;
      if (bk && b.bookmaker !== bk) return false;
      if (trn && b.tournament !== trn) return false;
      if (res && b.result !== res) return false;
      if (q) {
        const hay = `${b.match || ''} ${b.pick || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const anyActive = !!(q || disc || bk || trn || res);
    filterResetBtn.style.display = anyActive ? '' : 'none';
    filterCount.textContent = anyActive ? `${filtered.length} из ${allBets.length}` : '';

    if (!allBets.length) {
      betFeed.innerHTML = '';
      emptyState.style.display = 'block';
      filterEmptyState.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    if (!filtered.length) {
      betFeed.innerHTML = '';
      filterEmptyState.style.display = 'block';
      return;
    }
    filterEmptyState.style.display = 'none';
    renderFeed(filtered);
  }

  function resetFilters(){
    filterSearch.value = '';
    filterDiscipline.value = '';
    filterBookmaker.value = '';
    filterTournament.value = '';
    filterResult.value = '';
    applyFilters();
  }

  filterSearch.addEventListener('input', applyFilters);
  [filterDiscipline, filterBookmaker, filterTournament, filterResult].forEach(el => el.addEventListener('change', applyFilters));
  filterResetBtn.addEventListener('click', resetFilters);
  clearFiltersLink.addEventListener('click', (e) => { e.preventDefault(); resetFilters(); });

  async function loadBets(){
    const [{ data, error }, edgesRes] = await Promise.all([
      supabase
        .from('bets')
        .select('*')
        .eq('channel', activeChannel)
        .order('bet_date', { ascending: false })
        .order('created_at', { ascending: false }),
      supabase.from('edges').select('name').eq('channel', activeChannel),
    ]);

    if (error) {
      formStatus.textContent = 'Ошибка загрузки: ' + error.message;
      return;
    }
    allBets = data || [];
    const channelLabel = activeChannel === 'cybervalue' ? 'Cybervalue' : 'Личный дневник';
    countNote.textContent = `${channelLabel} · ${allBets.length} ${allBets.length === 1 ? 'ставка' : 'ставок'}`;
    updateBookmakerList(allBets);
    // Реестр edges может ещё не существовать (пока не выполнена
    // schema_milestone6.sql) — тогда просто используем только теги из ставок,
    // как и раньше.
    const registeredEdges = edgesRes && !edgesRes.error ? (edgesRes.data || []) : [];
    updateEdgeList(allBets, registeredEdges);
    populateFilterOptions(allBets);
    applyFilters();
  }

  // Букмекеры, которые пользователь уже вводил, — предлагаются подсказкой
  // при следующем вводе (без отдельной таблицы: просто уникальные значения
  // из его же ставок).
  function updateBookmakerList(data){
    const names = Array.from(new Set(data.map(b => (b.bookmaker || '').trim()).filter(Boolean))).sort();
    bookmakerList.innerHTML = names.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
  }

  // Эдж-паттерны — та же идея, что и с букмекерами: вводишь метку один раз,
  // дальше она подсказывается автодополнением, чтобы одна и та же метка не
  // разъезжалась по написанию (например "closing-value" vs "Closing Value")
  // и статистика на странице "Найденные эджи" считалась по-настоящему по
  // одному и тому же паттерну.
  function updateEdgeList(data, registeredEdges){
    const fromBets = data.map(b => (b.edge_tag || '').trim()).filter(Boolean);
    const fromRegistry = (registeredEdges || []).map(e => (e.name || '').trim()).filter(Boolean);
    const tags = Array.from(new Set([...fromBets, ...fromRegistry])).sort();
    edgeList.innerHTML = tags.map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
  }

  // Подтверждение перед удалением — без него случайный тап по ✕ безвозвратно
  // уничтожает ставку, а восстановить её нечем.
  async function deleteBet(id, label){
    const ok = window.confirm(label ? `Удалить ставку «${label}»? Это необратимо.` : 'Удалить эту ставку? Это необратимо.');
    if (!ok) return;
    const { error } = await supabase.from('bets').delete().eq('id', id);
    if (error) {
      formStatus.textContent = 'Не удалось удалить: ' + error.message;
      return;
    }
    if (editIdField.value === String(id)) exitEditMode();
    loadBets();
  }

  // Форма "Добавить ставку" работает в двух режимах: добавление новой и
  // редактирование существующей (когда f_editId заполнен клавишей "✎ Изменить"
  // на карточке). Это позволяет поправить любое поле ставки без удаления
  // и пересоздания — важно, когда доступ уже дан нескольким людям и опечатки
  // при вводе неизбежны.
  function enterEditMode(bet){
    editIdField.value = bet.id;
    document.getElementById('f_date').value = bet.bet_date;
    document.getElementById('f_discipline').value = bet.discipline;
    document.getElementById('f_bookmaker').value = bet.bookmaker || '';
    document.getElementById('f_tournament').value = bet.tournament || '';
    document.getElementById('f_match').value = bet.match || '';
    document.getElementById('f_pick').value = bet.pick || '';
    document.getElementById('f_odds').value = bet.odds;

    const express = parseExpressLegs(bet.pick);
    if (express) {
      setExpressMode(true);
      populateExpressLegs(express.legs.map(splitLegTextOdds));
    } else {
      setExpressMode(false);
      clearExpressLegs();
    }

    document.getElementById('f_flat').value = bet.flat_mult;
    document.getElementById('f_stake').value = bet.stake;
    resultSelect.value = bet.result;
    document.getElementById('f_type').value = bet.bet_type || '';
    document.getElementById('f_conviction').value = bet.conviction ? String(bet.conviction) : '';
    document.getElementById('f_edge').value = bet.edge_tag || '';
    document.getElementById('f_notes').value = bet.notes || '';

    const isSold = bet.result === 'Sold';
    manualProfitField.style.display = isSold ? '' : 'none';
    manualProfitInput.required = isSold;
    manualProfitInput.value = bet.manual_profit != null ? bet.manual_profit : '';

    betFormHeading.textContent = 'Редактировать ставку';
    addBtn.textContent = 'Сохранить изменения';
    cancelEditBtn.style.display = '';
    betFormBlock.classList.add('editing');
    betFormBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function exitEditMode(){
    betForm.reset();
    editIdField.value = '';
    document.getElementById('f_flat').value = 1;
    document.getElementById('f_date').value = todayLocalStr();
    manualProfitField.style.display = 'none';
    manualProfitInput.required = false;
    clearExpressLegs();
    setExpressMode(false);
    betFormHeading.textContent = 'Добавить ставку';
    addBtn.textContent = 'Добавить ставку';
    cancelEditBtn.style.display = 'none';
    betFormBlock.classList.remove('editing');
  }

  cancelEditBtn.addEventListener('click', () => {
    exitEditMode();
    formStatus.textContent = '';
  });

  betForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const editId = editIdField.value;

    let matchVal, pickVal, oddsVal;
    if (isExpressCheckbox.checked) {
      const legs = Array.from(expressLegsList.querySelectorAll('.express-leg-row')).map(row => ({
        text: row.querySelector('.leg-text-input').value.trim(),
        odds: Number(row.querySelector('.leg-odds-input').value),
      })).filter(l => l.text && l.odds > 1);
      if (legs.length < 2) {
        formStatus.textContent = 'В экспрессе должно быть минимум 2 ноги с текстом и кэфом.';
        return;
      }
      const countLabel = `${legs.length} ${ruCount(legs.length, 'событие', 'события', 'событий')}`;
      matchVal = null;
      pickVal = `Экспресс (${countLabel}): ${legs.map(l => `${l.text} @${l.odds.toFixed(2)}`).join(' + ')}`;
      oddsVal = legs.reduce((a, l) => a * l.odds, 1);
    } else {
      matchVal = document.getElementById('f_match').value.trim() || null;
      pickVal = document.getElementById('f_pick').value.trim();
      oddsVal = Number(document.getElementById('f_odds').value);
    }

    addBtn.disabled = true;
    formStatus.textContent = 'Сохраняю…';

    const payload = {
      user_id: session.user.id,
      channel: activeChannel,
      bet_date: document.getElementById('f_date').value,
      discipline: document.getElementById('f_discipline').value,
      bookmaker: document.getElementById('f_bookmaker').value.trim(),
      tournament: document.getElementById('f_tournament').value.trim() || null,
      match: matchVal,
      pick: pickVal,
      odds: oddsVal,
      flat_mult: Number(document.getElementById('f_flat').value),
      stake: Number(document.getElementById('f_stake').value),
      result: document.getElementById('f_result').value,
      bet_type: document.getElementById('f_type').value || null,
      conviction: document.getElementById('f_conviction').value ? Number(document.getElementById('f_conviction').value) : null,
      edge_tag: document.getElementById('f_edge').value.trim() || null,
      notes: document.getElementById('f_notes').value.trim() || null,
      manual_profit: document.getElementById('f_result').value === 'Sold' && document.getElementById('f_manualProfit').value
        ? Number(document.getElementById('f_manualProfit').value) : null,
    };

    const { error } = editId
      ? await supabase.from('bets').update(payload).eq('id', editId)
      : await supabase.from('bets').insert(payload);
    addBtn.disabled = false;

    if (error) {
      formStatus.textContent = 'Ошибка: ' + error.message;
      return;
    }
    formStatus.textContent = editId ? 'Изменения сохранены.' : 'Добавлено.';
    exitEditMode();
    loadBets();
  });

  // Поле "Профит от продажи" нужно только когда результат — досрочная продажа.
  resultSelect.addEventListener('change', () => {
    const isSold = resultSelect.value === 'Sold';
    manualProfitField.style.display = isSold ? '' : 'none';
    manualProfitInput.required = isSold;
  });

  document.getElementById('f_date').value = todayLocalStr();
  loadBets();
</script>

</body>
</html>
