<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пароль — EDGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=29">
<!-- EDGE 2.0 — новая дизайн-система (палитра/типографика/фон), см. styles-edge2.css -->
<link rel="stylesheet" href="styles-edge2.css?v=1">
</head>
<body>

<div class="auth-shell">
  <div class="auth-hero">
    <div class="auth-hero-inner">
      <svg class="brand-mark" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--gold)" stroke-width="1.6" opacity="0.28"/><path d="M16 4 A12 12 0 0 1 26.9 12.3" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="12" x2="19" y2="12" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="16" x2="17.5" y2="16" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="20" x2="19" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/></svg>
      <h2>Новый пароль — и снова в дело.</h2>
      <p>Задай новый пароль от своего журнала ставок. Старый пароль после этого перестанет работать.</p>
    </div>
  </div>

  <div class="auth-form-panel">
    <div class="auth-card">
      <h1 class="auth-brand mobile-only"><svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--gold)" stroke-width="1.6" opacity="0.28"/><path d="M16 4 A12 12 0 0 1 26.9 12.3" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="12" x2="19" y2="12" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="16" x2="17.5" y2="16" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="20" x2="19" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/></svg>EDGE<span style="color:var(--gold)">.</span></h1>
      <p class="lede" id="resetLede">Проверяю ссылку…</p>

      <form id="resetForm" style="display:none;">
        <div class="field">
          <label for="newPassword">Новый пароль</label>
          <input id="newPassword" type="password" autocomplete="new-password" required minlength="6">
        </div>
        <div class="field">
          <label for="newPassword2">Повторите пароль</label>
          <input id="newPassword2" type="password" autocomplete="new-password" required minlength="6">
        </div>
        <button class="btn btn-primary" type="submit" id="resetSubmitBtn">Сохранить пароль</button>
      </form>

      <div class="auth-msg" id="resetMsg"></div>

      <div class="auth-toggle" id="backToggle" style="display:none;">
        <a id="backLink" href="index.html">Ко входу</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js';

  const lede = document.getElementById('resetLede');
  const form = document.getElementById('resetForm');
  const msgEl = document.getElementById('resetMsg');
  const backToggle = document.getElementById('backToggle');
  const submitBtn = document.getElementById('resetSubmitBtn');

  function showMsg(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'auth-msg show ' + kind;
  }

  // Переход по ссылке из письма даёт временную сессию восстановления — SDK сам
  // разбирает токен из URL при загрузке страницы (detectSessionInUrl). Слушаем
  // событие PASSWORD_RECOVERY, а на случай гонки — на всякий случай перепроверяем
  // сессию сразу же и через короткую паузу.
  let ready = false;
  function reveal(){
    if (ready) return;
    ready = true;
    lede.textContent = 'Придумайте новый пароль.';
    form.style.display = '';
  }

  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') reveal();
  });

  setTimeout(async () => {
    if (ready) return;
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      reveal();
    } else {
      lede.textContent = 'Ссылка недействительна или уже использована.';
      showMsg('Запросите новую ссылку для сброса пароля на странице входа.', 'error');
      backToggle.style.display = '';
    }
  }, 1200);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('newPassword2').value;
    if (p1 !== p2) {
      showMsg('Пароли не совпадают.', 'error');
      return;
    }
    submitBtn.disabled = true;
    const { error } = await supabase.auth.updateUser({ password: p1 });
    if (error) {
      showMsg(error.message, 'error');
      submitBtn.disabled = false;
      return;
    }
    form.style.display = 'none';
    lede.textContent = 'Пароль обновлён.';
    showMsg('Готово — теперь можно войти с новым паролем.', 'ok');
    backToggle.style.display = '';
    backToggle.querySelector('a').textContent = 'Войти';
    await supabase.auth.signOut();
  });
</script>

</body>
</html>
