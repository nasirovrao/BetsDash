<style>
  /* 01.09.2026: страница была одной узкой колонкой (.feed-wrap max-width:640px)
     без вообще какого-либо контекста, кроме самой ленты — по фидбоку "выглядит
     очень скупо". Добавлен сайдбар слева: фильтр по результату (доп. к уже
     существующему по дисциплине) и топ капперов с сортировкой. Page-scoped —
     тот же приём, что и в других местах (стили нужны только этой странице). */
  .feed-page-wrap{ max-width:1040px; margin:0 auto; }
  .feed-layout{ display:grid; grid-template-columns:260px 1fr; gap:24px; align-items:start; }
  @media (max-width:860px){
    .feed-layout{ grid-template-columns:1fr; }
    .feed-sidebar{ position:static !important; order:2; }
  }
  .feed-sidebar{ display:flex; flex-direction:column; gap:18px; position:sticky; top:20px; }
  .feed-side-block{ background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .feed-side-title{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--ink-faint);
  }
  .feed-side-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .feed-side-title-row .feed-side-title{ margin:0; }
  .feed-side-select{
    font-family:'JetBrains Mono', monospace; font-size:10px; background:var(--bg-raised);
    border:1px solid var(--line); color:var(--ink-dim); border-radius:6px; padding:4px 6px; cursor:pointer;
  }
  .feed-side-block .feed-filter-row{ margin:12px 0 0; }
  .lb-empty{ font-size:12px; color:var(--ink-faint); margin-top:10px; line-height:1.5; }
  .lb-item{
    display:flex; align-items:center; gap:6px; padding:8px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .lb-item:last-child{ border-bottom:none; }
  .lb-item-link{ display:flex; align-items:center; gap:9px; min-width:0; flex:1; text-decoration:none; color:inherit; }
  .lb-item:hover .lb-name{ color:var(--gold); }
  .lb-rank{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); width:14px; flex:none; }
  .lb-info{ min-width:0; flex:1; }
  .lb-name{
    font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; transition:color .15s ease;
  }
  .lb-sub{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-faint); }
  .lb-value{ font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600; flex:none; color:var(--ink); }
  .lb-value.pos{ color:var(--teal); }
  .lb-value.neg{ color:var(--rust); }

  /* 01.09.2026: фильтр по капперу + букмекеру (по факту скрина "Детальная
     статистика" — По букмекерам/По капперам уже есть как признанная категория
     в других разделах сайта, значит это реальные, а не придуманные оси). */
  .lb-filter-btn{
    flex:none; width:24px; height:24px; border-radius:6px; border:1px solid transparent;
    background:none; color:var(--ink-faint); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .lb-filter-btn:hover, .lb-filter-btn:focus-visible{ color:var(--gold); border-color:var(--line); background:var(--bg-raised); }
  .lb-filter-btn svg{ width:13px; height:13px; }

  .feed-active-filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .feed-active-chip{
    display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace;
    font-size:11px; color:var(--ink); background:var(--bg-card); border:1px solid var(--line);
    border-radius:999px; padding:5px 6px 5px 12px; text-decoration:none;
  }
  .feed-active-chip b{ font-weight:600; }
  .feed-active-chip .x{
    width:16px; height:16px; border-radius:50%; background:var(--bg-raised); color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1;
  }
  .feed-active-chip:hover .x{ color:var(--rust); }

  .feed-post-headline{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; text-decoration:none; color:inherit; }
  .feed-post-body{ display:block; text-decoration:none; color:inherit; }
  .feed-name-link{ text-decoration:none; color:inherit; min-width:0; }
  .feed-name-link:hover .feed-name-row{ color:var(--gold); }
  .feed-post-filter{
    flex:none; width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--ink-faint); display:flex; align-items:center;
    justify-content:center; cursor:pointer; text-decoration:none; transition:color .15s ease, border-color .15s ease;
  }
  .feed-post-filter:hover, .feed-post-filter:focus-visible{ color:var(--gold); border-color:var(--gold); }
  .feed-post-filter svg{ width:12px; height:12px; }
  .feed-bk{ font-family:'JetBrains Mono', monospace; }

  /* 04.09.2026: быстрая подписка — тот же визуальный язык, что у
     .feed-post-filter/.lb-filter-btn (мелкая иконка-кнопка), просто
     подсвечивается зелёным в состоянии .is-following ("уже подписан"). */
  .feed-post-follow{
    flex:none; width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--ink-faint); display:flex; align-items:center;
    justify-content:center; cursor:pointer; transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .feed-post-follow:hover, .feed-post-follow:focus-visible{ color:var(--gold); border-color:var(--gold); }
  .feed-post-follow.is-following{ color:var(--teal); border-color:var(--teal); }
  .feed-post-follow svg{ width:13px; height:13px; }
  .lb-follow-btn{ width:24px; height:24px; border-radius:6px; }
  .lb-follow-btn svg{ width:12px; height:12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--gold)" stroke-width="1.6" opacity="0.28"/><path d="M16 4 A12 12 0 0 1 26.9 12.3" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="12" x2="19" y2="12" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="16" x2="17.5" y2="16" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="20" x2="19" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/></svg>EDGE<span>.</span></a>
    <div class="topbar-user" id="topbarUser">
      <a class="topbar-link" href="index.html">Войти в EDGE</a>
    </div>
  </div>
</div>

<section>
  <div class="wrap feed-page-wrap">
    <div class="section-head" style="margin-bottom:18px;">
      <h2>Лента ставок</h2>
      <div class="section-note">Все ставки из публичных каналов EDGE, в порядке публикации — видно, кто и когда каждую опубликовал.</div>
    </div>
    <div class="feed-layout">
      <aside class="feed-sidebar">
        <div class="feed-side-block" id="followScopeBlock" style="display:none;">
          <div class="feed-side-title">Показывать</div>
          <div class="feed-filter-row" id="followScopeFilters"></div>
        </div>
        <div class="feed-side-block">
          <div class="feed-side-title">Дисциплина</div>
          <div class="feed-filter-row" id="feedFilters" style="display:none;"></div>
        </div>
        <div class="feed-side-block">
          <div class="feed-side-title">Результат</div>
          <div class="feed-filter-row" id="resultFilters"></div>
        </div>
        <div class="feed-side-block" id="bkFilterBlock" style="display:none;">
          <div class="feed-side-title">Букмекер</div>
          <div class="feed-filter-row" id="bkFilters"></div>
        </div>
        <div class="feed-side-block">
          <div class="feed-side-title-row">
            <div class="feed-side-title">Топ капперы</div>
            <select id="leaderboardSort" class="feed-side-select">
              <option value="roi">ROI</option>
              <option value="profit">Профит</option>
              <option value="winrate">Винрейт</option>
              <option value="rating">Рейтинг</option>
            </select>
          </div>
          <div id="leaderboardRoot"><div class="lb-empty">Загружаю…</div></div>
        </div>
      </aside>
      <div class="feed-main">
        <div class="feed-active-filters" id="activeFilters"></div>
        <div id="feedRoot"><div class="empty-state">Загружаю…</div></div>
      </div>
    </div>
  </div>
</section>

<script type="module">
  import { supabase } from './supabase-client.js';
  import { escapeHtml, fmtRelativeTime, fmtDateTime, initEmailPrivacyToggle, computeStats, computeRatingTier, fmtMoney, getDisplayCurrency } from './lib.js';

  const params = new URLSearchParams(location.search);
  const disciplineFilter = params.get('d') || '';
  const resultFilter = params.get('r') || '';
  const bkFilter = params.get('b') || '';
  const authorFilter = params.get('u') || '';
  // 04.09.2026: "Мои подписки" — тот же паттерн, что и остальные фильтры
  // ленты (URL-параметр + ссылка), а не отдельная сохраняемая настройка:
  // по умолчанию '' (показывает всё), переключается кликом по ссылке в
  // сайдбаре, состояние переживает переход между другими фильтрами ленты
  // (см. feedHref ниже — f не нужно передавать явно в старых вызовах).
  const followScope = params.get('f') || '';

  // Строит ссылку на саму ленту сразу со всеми фильтрами — переключение
  // одного не должно сбрасывать остальные уже выбранные. Порядок аргументов
  // фиксированный (d, r, b, u), вызовы ниже всегда передают все четыре.
  // 5-й необязательный аргумент f — если не передан явно, берётся текущий
  // followScope из замыкания (поэтому существующие вызовы без пятого
  // аргумента не сбрасывают "Мои подписки" при переключении дисциплины/
  // результата/букмекера/каппера — сбросить его может только сама ссылка
  // в блоке "Показывать" ниже, которая передаёт f явно).
  function feedHref(d, r, b, u, f) {
    const p = new URLSearchParams();
    if (d) p.set('d', d);
    if (r) p.set('r', r);
    if (b) p.set('b', b);
    if (u) p.set('u', u);
    const fVal = f !== undefined ? f : followScope;
    if (fVal) p.set('f', fVal);
    const qs = p.toString();
    return 'feed.html' + (qs ? '?' + qs : '');
  }
  const FILTER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/></svg>';
  const FOLLOW_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  const FOLLOWING_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

  // 01.09.2026: страница публичная (работает и вообще без входа), но раньше
  // топбар ВСЕГДА показывал "Войти в EDGE", даже если человек уже залогинен
  // в этом же браузере (сессия жива в другой вкладке/на другой странице) —
  // requireSession() тут намеренно не используется (не хотим редиректить
  // анонимного читателя на index.html), но и вообще не проверять сессию
  // было неправильно. getSession() ничего никуда не редиректит сама по
  // себе — просто смотрит, есть ли уже живая сессия, и красит топбар под
  // неё, как на остальных страницах.
  //
  // 02.09.2026: тот же session нужен ещё и для "Валюты отображения"
  // (personal-settings.html, schema_milestone30.sql) — "Профит" в топе
  // капперов ниже показывается в валюте ЗРИТЕЛЯ (не того, кто постил —
  // хранение везде доллары, конвертация чисто отображение). Курс — сетевой
  // запрос, поэтому не ждём его здесь блокирующе: кикаем промис сразу,
  // await делаем только перед самим рендером лидерборда, параллельно с
  // куда более долгим N+1-запросом всех публичных профилей/ставок ниже.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    const topbarUser = document.getElementById('topbarUser');
    topbarUser.innerHTML = `<span id="userEmail">…</span><button id="logoutBtn" type="button">Выйти</button>`;
    initEmailPrivacyToggle(session.user.email);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.reload();
    });
  }
  const displayCurrencyPromise = getDisplayCurrency(supabase, session?.user?.id || null);

  // 04.09.2026: подписки (schema_milestone33.sql) — свой список подписок
  // нужен для (1) фильтра "Мои подписки" и (2) быстрой кнопки +/✓ прямо на
  // карточке в ленте. followSet — строки "user_id|channel" для O(1)
  // проверки при рендере каждой карточки, а не N обращений к массиву.
  // Для анонимного зрителя — пустой набор, кнопки подписки просто не
  // рендерятся (см. ниже), но сама лента продолжает работать как раньше.
  let followSet = new Set();
  if (session) {
    const { data: myFollows } = await supabase.from('follows').select('followed_user_id, followed_channel').eq('follower_user_id', session.user.id);
    followSet = new Set((myFollows || []).map(f => `${f.followed_user_id}|${f.followed_channel}`));
  }

  const feedRoot = document.getElementById('feedRoot');
  const followScopeBlock = document.getElementById('followScopeBlock');
  const followScopeFilters = document.getElementById('followScopeFilters');
  const feedFilters = document.getElementById('feedFilters');
  const resultFilters = document.getElementById('resultFilters');
  const bkFilterBlock = document.getElementById('bkFilterBlock');
  const bkFilters = document.getElementById('bkFilters');
  const activeFilters = document.getElementById('activeFilters');
  const leaderboardRoot = document.getElementById('leaderboardRoot');
  const leaderboardSort = document.getElementById('leaderboardSort');

  const RES_CLASS = { Win: 'win', Loss: 'loss', Push: 'push', Pending: 'pending', Sold: 'sold' };
  const RES_LABEL = { Win: 'WIN', Loss: 'LOSS', Push: 'PUSH', Pending: 'В ИГРЕ', Sold: 'ПРОДАНО' };

  function initialsOf(name) {
    const parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }
  const VERIFY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 2.2 3.2-.6.9 3.1 3.1.9-.6 3.2L23 12l-2.2 2.4.6 3.2-3.1.9-.9 3.1-3.2-.6L12 23l-2.4-2.2-3.2.6-.9-3.1-3.1-.9.6-3.2L1 12l2.2-2.4-.6-3.2 3.1-.9.9-3.1 3.2.6L12 2z"/><path d="M8.5 12.2l2.4 2.4 4.6-5.2" stroke="var(--bg-card)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Кросс-профильный запрос: сначала все публичные профили, потом для
  // каждого — ставки его публичного канала, параллельно. Без join —
  // мок-клиент (app_test8) его не умеет, а настоящий Supabase/PostgREST
  // потребовал бы foreign key embedding, которого сейчас нет между bets и
  // profiles. При росте числа публичных профилей это N+1-запросов, что
  // нормально для текущего масштаба, но при росте стоит пересмотреть
  // (например через SQL VIEW на стороне базы). Ограничиваем ленту 60
  // последними записями — полноценная пагинация/infinite scroll не в
  // рамках этой версии.
  const FEED_LIMIT = 60;

  const { data: profiles, error: profilesErr } = await supabase
    .from('profiles').select('*').eq('is_public', true);

  if (profilesErr || !profiles || !profiles.length) {
    feedRoot.innerHTML = '<div class="empty-state">Пока нет ни одного публичного канала — лента появится, как только кто-то включит публичность в настройках профиля.</div>';
  } else {
    const results = await Promise.all(profiles.map(async p => {
      const channel = p.channel || 'cybervalue';
      const [{ data: bets }, { data: settingsRow }] = await Promise.all([
        supabase.from('bets').select('*').eq('user_id', p.user_id).eq('channel', channel),
        supabase.from('settings').select('hidden_bookmakers').eq('user_id', p.user_id).eq('channel', channel).maybeSingle(),
      ]);
      // 02.09.2026: "скрывать букмекеров по запросу" (bookmakers.html,
      // schema_milestone31.sql) — тот же принцип, что и на public.html:
      // маскируем название прямо здесь, один раз на каждого автора, до того
      // как ставки попадут в саму ленту/фильтр по букмекеру/лидерборд.
      const hiddenBk = settingsRow && Array.isArray(settingsRow.hidden_bookmakers) ? settingsRow.hidden_bookmakers : [];
      const maskedBets = (bets || []).map(b => hiddenBk.includes(b.bookmaker) ? { ...b, bookmaker: 'Скрыто' } : b);
      return maskedBets.map(b => ({ bet: b, profile: p }));
    }));
    let items = results.flat();

    // 04.09.2026: фильтр "Показывать: Все / Мои подписки" — только для
    // залогиненных (анонимному зрителю подписываться не на что), сам блок
    // в разметке скрыт по умолчанию (display:none), см. followScopeBlock.
    if (session) {
      followScopeBlock.style.display = '';
      const allActive = followScope !== '1' ? ' class="active"' : '';
      const onlyActive = followScope === '1' ? ' class="active"' : '';
      followScopeFilters.innerHTML =
        `<a href="${feedHref(disciplineFilter, resultFilter, bkFilter, authorFilter, '')}"${allActive}>Все</a>` +
        `<a href="${feedHref(disciplineFilter, resultFilter, bkFilter, authorFilter, '1')}"${onlyActive}>Мои подписки</a>`;
    }

    // Дисциплины для фильтра — по факту встречающиеся в ленте, а не
    // фиксированный список (заранее не знаем, что публикуют каппера).
    const disciplines = Array.from(new Set(items.map(it => it.bet.discipline).filter(Boolean))).sort();
    if (disciplines.length > 1) {
      feedFilters.style.display = '';
      const allActive = !disciplineFilter ? ' active' : '';
      feedFilters.innerHTML = `<a href="${feedHref('', resultFilter, bkFilter, authorFilter)}"${allActive ? ' class="active"' : ''}>Все</a>` +
        disciplines.map(d => `<a href="${feedHref(d, resultFilter, bkFilter, authorFilter)}"${d === disciplineFilter ? ' class="active"' : ''}>${escapeHtml(d)}</a>`).join('');
    }

    // Фильтр по результату (01.09.2026, по запросу) — та же механика, что и
    // у дисциплины: список вариантов строится по факту встречающихся в
    // ленте результатов, а не фиксированный набор.
    const RESULT_ORDER = ['Win', 'Loss', 'Push', 'Pending', 'Sold'];
    const resultsPresent = RESULT_ORDER.filter(r => items.some(it => it.bet.result === r));
    if (resultsPresent.length > 1) {
      const allActive = !resultFilter ? ' active' : '';
      resultFilters.innerHTML = `<a href="${feedHref(disciplineFilter, '', bkFilter, authorFilter)}"${allActive ? ' class="active"' : ''}>Все</a>` +
        resultsPresent.map(r => `<a href="${feedHref(disciplineFilter, r, bkFilter, authorFilter)}"${r === resultFilter ? ' class="active"' : ''}>${RES_LABEL[r]}</a>`).join('');
    } else {
      resultFilters.innerHTML = '';
    }

    // Фильтр по букмекеру (01.09.2026) — вместе с фильтром по капперу это
    // и есть те две реальные оси из "Детальной статистики" (По букмекерам /
    // По капперам), в отличие от диапазона кэфа и периода — от них решили
    // отказаться как от несвойственных именно ленте метрик.
    const bookmakers = Array.from(new Set(items.map(it => it.bet.bookmaker).filter(Boolean))).sort();
    if (bookmakers.length > 1) {
      bkFilterBlock.style.display = '';
      const allActive = !bkFilter ? ' active' : '';
      bkFilters.innerHTML = `<a href="${feedHref(disciplineFilter, resultFilter, '', authorFilter)}"${allActive ? ' class="active"' : ''}>Все</a>` +
        bookmakers.map(b => `<a href="${feedHref(disciplineFilter, resultFilter, b, authorFilter)}"${b === bkFilter ? ' class="active"' : ''}>${escapeHtml(b)}</a>`).join('');
    }

    if (disciplineFilter) {
      items = items.filter(it => it.bet.discipline === disciplineFilter);
    }
    if (resultFilter) {
      items = items.filter(it => it.bet.result === resultFilter);
    }
    if (bkFilter) {
      items = items.filter(it => it.bet.bookmaker === bkFilter);
    }
    if (authorFilter) {
      items = items.filter(it => it.profile.username === authorFilter);
    }
    if (followScope === '1') {
      items = items.filter(it => followSet.has(`${it.profile.user_id}|${it.profile.channel || 'cybervalue'}`));
    }

    // Фильтр по капперу задаётся не списком в сайдбаре (капперов может быть
    // много и не всех стоит перечислять), а кликом по иконке-воронке у имени
    // в топе или прямо на карточке в ленте — активный фильтр показывается
    // отдельным чипом над лентой, с крестиком для сброса.
    if (authorFilter) {
      const authorItem = results.flat().find(({ profile }) => profile.username === authorFilter);
      const authorName = authorItem ? escapeHtml(authorItem.profile.display_name || authorItem.profile.username) : escapeHtml(authorFilter);
      activeFilters.innerHTML = `<a class="feed-active-chip" href="${feedHref(disciplineFilter, resultFilter, bkFilter, '')}">Каппер: <b>${authorName}</b><span class="x">✕</span></a>`;
    } else {
      activeFilters.innerHTML = '';
    }

    // Топ капперы — считаем один раз по ПОЛНОМУ набору (results, ДО
    // дисциплины/результата — рейтинг каппера не должен прыгать от того,
    // какой фильтр ленты сейчас выбран), группируя те же самые данные, что
    // уже загружены для самой ленты — ни одного лишнего запроса к базе.
    // Порог в 5 ставок — отсекает шум от каппера с одной случайно удачной
    // ставкой наверху таблицы по ROI/профиту.
    const MIN_BETS_FOR_LEADERBOARD = 5;
    const byProfile = new Map();
    results.flat().forEach(({ bet, profile }) => {
      if (!byProfile.has(profile.user_id)) byProfile.set(profile.user_id, { profile, bets: [] });
      byProfile.get(profile.user_id).bets.push(bet);
    });
    const leaderboardEntries = Array.from(byProfile.values())
      .filter(e => e.bets.length >= MIN_BETS_FOR_LEADERBOARD)
      .map(e => ({
        profile: e.profile,
        stats: computeStats(e.bets, [], 0),
        rating: computeRatingTier(e.bets),
      }));

    // 01.09.2026, по фидбоку: "Рейтинг" по умолчанию сбивал с толку — его
    // число растёт почти линейно от ЧИСЛА ставок (см. computeRatingTier в
    // lib.js), выглядит как "у кого больше ставок, тот и топ", а не как
    // качество игры. Дефолт — ROI, "Рейтинг" остаётся отдельным вариантом
    // в списке, не главным. Плюс под именем теперь всегда видно реальное
    // число ставок (winrateInfo) — откуда вообще взялась цифра ранжирования,
    // не приходится гадать.
    //
    // 02.09.2026: "Профит" в этом списке — единственное место в ленте, где
    // сравниваются РАЗНЫЕ пользователи бок о бок (у поста в самой ленте
    // валюта того, кто постил, тут — валюта ЗРИТЕЛЯ, иначе сравнение было
    // бы нечестным при разных личных валютах у капперов, см. CHANGELOG).
    // Промис кикнут ещё в начале скрипта, параллельно с более долгим
    // N+1-запросом всех профилей/ставок выше — здесь просто ждём результат.
    const { currency: dispCurrency, rate: dispRate } = await displayCurrencyPromise;
    function renderLeaderboard(sortKey) {
      if (!leaderboardEntries.length) {
        leaderboardRoot.innerHTML = `<div class="lb-empty">Пока нет капперов минимум с ${MIN_BETS_FOR_LEADERBOARD} ставками в истории.</div>`;
        return;
      }
      const sorted = leaderboardEntries.slice().sort((a, b) => {
        if (sortKey === 'profit') return b.stats.totalProfit - a.stats.totalProfit;
        if (sortKey === 'winrate') return (b.stats.winrate ?? -Infinity) - (a.stats.winrate ?? -Infinity);
        if (sortKey === 'rating') return b.rating.score - a.rating.score;
        return (b.stats.roi ?? -Infinity) - (a.stats.roi ?? -Infinity);
      }).slice(0, 5);
      leaderboardRoot.innerHTML = sorted.map((e, i) => {
        const name = escapeHtml(e.profile.display_name || e.profile.username);
        const betsSub = `${e.stats.total} ${ruCount(e.stats.total, 'ставка', 'ставки', 'ставок')}`;
        const lbChannel = e.profile.channel || 'cybervalue';
        const lbIsOwn = session && session.user.id === e.profile.user_id;
        const lbIsFollowing = followSet.has(`${e.profile.user_id}|${lbChannel}`);
        const lbFollowBtnHtml = (session && !lbIsOwn)
          ? `<button type="button" class="feed-post-follow lb-follow-btn${lbIsFollowing ? ' is-following' : ''}" data-uid="${e.profile.user_id}" data-channel="${escapeHtml(lbChannel)}" data-following="${lbIsFollowing}" title="${lbIsFollowing ? 'Отписаться от ' + name : 'Подписаться на ' + name}" aria-label="${lbIsFollowing ? 'Отписаться от ' + name : 'Подписаться на ' + name}">${lbIsFollowing ? FOLLOWING_ICON : FOLLOW_ICON}</button>`
          : '';
        let valueHtml;
        if (sortKey === 'profit') {
          const p = e.stats.totalProfit;
          valueHtml = `<span class="lb-value ${p > 0 ? 'pos' : p < 0 ? 'neg' : ''}">${fmtMoney(p, dispCurrency, dispRate)}</span>`;
        } else if (sortKey === 'winrate') {
          const wr = e.stats.winrate;
          valueHtml = `<span class="lb-value">${wr == null ? '—' : wr.toFixed(1) + '%'}</span>`;
        } else if (sortKey === 'rating') {
          valueHtml = `<span class="lb-value">${e.rating.score}</span>`;
        } else {
          const roi = e.stats.roi;
          valueHtml = `<span class="lb-value ${roi > 0 ? 'pos' : roi < 0 ? 'neg' : ''}">${roi == null ? '—' : (roi >= 0 ? '+' : '') + roi.toFixed(1) + '%'}</span>`;
        }
        return `
        <div class="lb-item">
          <a class="lb-item-link" href="public.html?u=${encodeURIComponent(e.profile.username)}">
            <span class="lb-rank">${i + 1}</span>
            <span class="lb-info">
              <span class="lb-name">${name}</span>
              <span class="lb-sub">${betsSub}</span>
            </span>
            ${valueHtml}
          </a>
          ${lbFollowBtnHtml}
          <a class="lb-filter-btn" href="${feedHref(disciplineFilter, resultFilter, bkFilter, e.profile.username)}" title="Показать только его ставки в этой ленте" aria-label="Показать в ленте только ${name}">${FILTER_ICON}</a>
        </div>`;
      }).join('');
    }
    // "ruCount" — то же русское склонение, что уже используется в других
    // местах проекта (dashboard.html и т.п.), локальная копия — общего
    // экспортируемого варианта под именно эти три формы в lib.js ещё нет.
    function ruCount(n, one, few, many) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return few;
      return many;
    }
    renderLeaderboard(leaderboardSort.value);
    leaderboardSort.addEventListener('change', () => renderLeaderboard(leaderboardSort.value));

    items.sort((a, b) => {
      const ta = a.bet.created_at || a.bet.bet_date || '';
      const tb = b.bet.created_at || b.bet.bet_date || '';
      return tb.localeCompare(ta);
    });
    items = items.slice(0, FEED_LIMIT);

    if (!items.length) {
      feedRoot.innerHTML = followScope === '1'
        ? `<div class="empty-state">${followSet.size ? 'Никто из тех, на кого ты подписан, пока не публиковал ставки.' : 'Ты пока ни на кого не подписан — найди каппера в ленте или в топе слева и нажми «Подписаться».'}</div>`
        : '<div class="empty-state">В этой ленте пока нет ставок.</div>';
    } else {
      feedRoot.innerHTML = items.map(({ bet, profile }) => {
        const name = escapeHtml(profile.display_name || profile.username);
        const cls = RES_CLASS[bet.result] || 'pending';
        const label = RES_LABEL[bet.result] || bet.result || '';
        const matchTitle = bet.match || '';
        const pickTitle = bet.pick || '';
        const addedTitle = bet.created_at ? `Добавлено в систему: ${fmtDateTime(bet.created_at)}` : '';
        const profileHref = `public.html?u=${encodeURIComponent(profile.username)}`;
        const filterHref = feedHref(disciplineFilter, resultFilter, bkFilter, profile.username);
        // 04.09.2026: быстрая подписка прямо из карточки — только если
        // залогинен и это не свой же пост (свои посты и так видны себе без
        // подписки, плюс follows_no_self_follow всё равно бы отклонил).
        const authorChannel = profile.channel || 'cybervalue';
        const isOwnPost = session && session.user.id === profile.user_id;
        const isFollowingAuthor = followSet.has(`${profile.user_id}|${authorChannel}`);
        const followBtnHtml = (session && !isOwnPost)
          ? `<button type="button" class="feed-post-follow${isFollowingAuthor ? ' is-following' : ''}" data-uid="${profile.user_id}" data-channel="${escapeHtml(authorChannel)}" data-following="${isFollowingAuthor}" title="${isFollowingAuthor ? 'Отписаться от ' + name : 'Подписаться на ' + name}" aria-label="${isFollowingAuthor ? 'Отписаться от ' + name : 'Подписаться на ' + name}">${isFollowingAuthor ? FOLLOWING_ICON : FOLLOW_ICON}</button>`
          : '';
        return `
        <div class="feed-post">
          <div class="feed-post-head">
            <a class="feed-post-headline" href="${profileHref}" title="${escapeHtml(addedTitle)}">
              <div class="feed-avatar">${profile.logo_url ? `<img src="${escapeHtml(profile.logo_url)}" alt="">` : escapeHtml(initialsOf(profile.display_name || profile.username))}</div>
              <div class="feed-who">
                <div class="feed-name-row">${name}${profile.is_verified ? `<span class="feed-verify">${VERIFY_ICON}</span>` : ''}</div>
                <div class="feed-handle">@${escapeHtml(profile.username)}</div>
              </div>
            </a>
            <div class="feed-time">${fmtRelativeTime(bet.created_at || bet.bet_date)}</div>
            ${followBtnHtml}
            <a class="feed-post-filter" href="${filterHref}" title="Показать только его ставки в этой ленте" aria-label="Показать в ленте только ${name}">${FILTER_ICON}</a>
          </div>
          <a class="feed-post-body" href="${profileHref}" title="${escapeHtml(addedTitle)}">
            <div class="feed-tags">
              <span class="res-pill ${cls}">${label}</span>
              <span class="feed-disc">${escapeHtml(bet.discipline || '—')}</span>
            </div>
            ${matchTitle ? `<div class="feed-match">${escapeHtml(matchTitle)}</div>` : ''}
            ${pickTitle && pickTitle !== matchTitle ? `<div class="feed-pick">${escapeHtml(pickTitle)}</div>` : ''}
            <div class="feed-meta">
              <span>Кэф <b>${bet.odds != null ? Number(bet.odds).toFixed(2) : '—'}</b></span>
              ${bet.bookmaker ? `<span class="feed-bk">${escapeHtml(bet.bookmaker)}</span>` : ''}
              ${bet.flat_mult ? `<span>Флет <b>${Number(bet.flat_mult).toFixed(2)}</b></span>` : ''}
            </div>
          </a>
        </div>`;
      }).join('');
    }

    // 04.09.2026: делегированный обработчик на сам feedRoot (не на каждую
    // карточку отдельно) — carточки внутри перерисовываются только полной
    // сменой feedRoot.innerHTML при загрузке страницы, сам feedRoot как
    // узел не пересоздаётся, поэтому один слушатель на всё время жизни
    // страницы. Optimistic UI — та же логика, что и на public.html
    // (initFollowButton): меняем иконку/состояние сразу, откатываем при
    // ошибке insert/delete.
    async function handleFollowClick(btn) {
      const followedUserId = btn.dataset.uid;
      const followedChannel = btn.dataset.channel;
      const wasFollowing = btn.dataset.following === 'true';
      const nowFollowing = !wasFollowing;
      btn.disabled = true;
      btn.classList.toggle('is-following', nowFollowing);
      btn.dataset.following = String(nowFollowing);
      btn.innerHTML = nowFollowing ? FOLLOWING_ICON : FOLLOW_ICON;
      const { error } = nowFollowing
        ? await supabase.from('follows').insert({ follower_user_id: session.user.id, followed_user_id: followedUserId, followed_channel: followedChannel })
        : await supabase.from('follows').delete().eq('follower_user_id', session.user.id).eq('followed_user_id', followedUserId).eq('followed_channel', followedChannel);
      btn.disabled = false;
      if (error) {
        btn.classList.toggle('is-following', wasFollowing);
        btn.dataset.following = String(wasFollowing);
        btn.innerHTML = wasFollowing ? FOLLOWING_ICON : FOLLOW_ICON;
        alert('Не получилось: ' + error.message);
        return;
      }
      const key = `${followedUserId}|${followedChannel}`;
      if (nowFollowing) followSet.add(key); else followSet.delete(key);
    }
    feedRoot.addEventListener('click', (e) => {
      const btn = e.target.closest('.feed-post-follow');
      if (btn) handleFollowClick(btn);
    });
    leaderboardRoot.addEventListener('click', (e) => {
      const btn = e.target.closest('.feed-post-follow');
      if (btn) handleFollowClick(btn);
    });
  }
</script>

</body>
