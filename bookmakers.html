<section>
  <div class="wrap">
    <div class="section-head">
      <h2>По букмекерам</h2>
      <div class="section-note">Кто из букмекеров реально приносит профит. Клик по карточке — полная статистика и список ставок.</div>
    </div>
    <div id="channelSwitch"></div>
    <div id="breakdownRoot"><div class="empty-state">Загружаю…</div></div>
  </div>
</section>

<script type="module">
  import { supabase, requireSession, isClvEnabled } from './supabase-client.js';
  import { groupBets, renderGroupCards, renderBreakdownDetail, getChannelParams, loadMyChannels, renderChannelSwitch, preserveChannelInNav, channelHref, initEmailPrivacyToggle} from './lib.js';

  const session = await requireSession();
  if (session) {
    initEmailPrivacyToggle(session.user.email);
  }
  isClvEnabled().then(on => { if (on) document.getElementById('navClvPill').style.display = ''; });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  const { channel: activeChannel, owner: ownerParam } = getChannelParams();
  const ownerUserId = ownerParam || session.user.id;
  preserveChannelInNav(activeChannel, ownerUserId, session.user.id);
  const pageFile = channelHref('bookmakers.html', activeChannel, ownerUserId, session.user.id);

  loadMyChannels(supabase, session.user.id).then(channels => {
    document.getElementById('channelSwitch').innerHTML =
      renderChannelSwitch(channels, activeChannel, ownerUserId, 'bookmakers.html');
  });

  const root = document.getElementById('breakdownRoot');
  const keyParam = new URLSearchParams(location.search).get('key');

  const { data, error } = await supabase.from('bets').select('*').eq('user_id', ownerUserId).eq('channel', activeChannel);
  if (error) {
    root.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
  } else {
    const groups = groupBets(data, b => b.bookmaker);
    if (keyParam) {
      const group = groups.find(g => g.key === keyParam);
      root.innerHTML = renderBreakdownDetail('Букмекер', keyParam, group, pageFile, true);
    } else {
      root.innerHTML = renderGroupCards(groups, 'Букмекер', pageFile);
    }
  }
</script>

</body>
</html>
