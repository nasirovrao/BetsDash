<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>(function(){try{if(localStorage.getItem('edge-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Публичный профиль — EDGE</title>
<meta name="description" content="Публичный, верифицируемый профиль ставок на EDGE — метки времени на каждой записи, без правок задним числом.">
<!--
  ВАЖНО про эти og/twitter-теги: страница рендерится на клиенте (JS
  подставляет имя каппера, статы и т.д. уже В БРАУЗЕРЕ), а боты соцсетей
  (Telegram/VK/Facebook/Discord…), которые генерируют превью ссылки, обычно
  JS не выполняют — они читают только то, что есть в исходном HTML. Поэтому
  превью ниже ОБЩИЕ для всех капперов/каналов, а не персональные (не покажет
  конкретно имя и лого Cybervalue) — таковы ограничения чисто статического
  хостинга без сервера. Настоящее персональное превью на канал потребовало
  бы отдельной серверной функции, которая подставляет теги до отдачи HTML
  ботам — это можно сделать позже, но не в рамках голого статического сайта.
  og:image указан ОТНОСИТЕЛЬНЫМ путём специально — тогда он одинаково
  корректно резолвится и на текущем github.io-адресе, и после переезда на
  свой домен, без правки кода.
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="EDGE">
<meta property="og:title" content="Публичный профиль ставок — EDGE">
<meta property="og:description" content="Верифицируемый трек-рекорд ставок: метки времени на каждой записи, без правок задним числом.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Публичный профиль ставок — EDGE">
<meta name="twitter:description" content="Верифицируемый трек-рекорд ставок: метки времени на каждой записи, без правок задним числом.">
<meta name="twitter:image" content="og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=30">
<!-- EDGE 2.0 — новая дизайн-система (палитра/типографика/фон), см. styles-edge2.css -->
<link rel="stylesheet" href="styles-edge2.css?v=1">
<link rel="stylesheet" href="styles-edge3.css?v=1">
<link rel="stylesheet" href="styles-edge4.css?v=2">
<link rel="stylesheet" href="styles-edge5.css?v=1">
<script src="theme-toggle.js" defer></script>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <!-- Новый знак — кольцо (базовая дуга приглушённая + яркий акцент —
         "твой эдж", как progress-ring) с буквой E внутри, вместо ромба,
         который совпадал по силуэту с Ethereum. -->
    <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--gold)" stroke-width="1.6" opacity="0.28"/><path d="M16 4 A12 12 0 0 1 26.9 12.3" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="12" x2="19" y2="12" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="16" x2="17.5" y2="16" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="20" x2="19" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/></svg>EDGE<span>.</span></a>
    <div class="topbar-user">
      <a class="topbar-link" href="feed.html">Лента ставок</a>
      <span id="topbarAuthArea"><a class="topbar-link" href="index.html">Войти в EDGE</a></span>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div id="profileHero"><div class="empty-state">Загружаю…</div></div>
    <nav class="app-nav public-tabs" id="publicTabs" style="display:none;"></nav>
    <div id="tabRoot"></div>
  </div>
</section>

<div class="public-footer-cta" id="footerCta" style="display:none;">
  <div class="wrap">
    <span>Хочешь такой же публичный, верифицируемый профиль ставок?</span>
    <a class="btn btn-primary" href="index.html" style="width:auto;">Начать в EDGE →</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js';
  import {
    fmtMoney, computeStats, computeStreak, computeFlatStats, renderWLP, escapeHtml,
    groupBets, groupBetsMulti, renderGroupCards, renderBreakdownDetail,
    classifyMarket, teamKeysForBet, renderBetsFlatTable,
    computeCardTrend, renderSparkline, renderWlpBars, renderTopBetsPop, initStatCardPopovers,
    computeRatingTier, computeSpecialization, renderProfileBanner, wasEditedAfterSettle,
    initEmailPrivacyToggle, getDisplayCurrency,
    monthKeyOf, monthLabelOf, weekKeyOf, weekLabelOf, dayKeyOf, dayLabelOf, monthYearGenitiveOf,
  } from './lib.js';

  // 02.09.2026: фильтр по периоду на вкладке "Дашборд" публичного профиля —
  // тот же PERIOD_CONFIGS/паттерн, что уже работает на приватном
  // dashboard.html (см. renderStats/applyDashFilters там же). Шапка профиля
  // выше (pf-stats/рейтинг) осознанно НЕ фильтруется — это "верифицируемый
  // трек-рекорд", там всегда весь срок целиком, фильтр — только внутри
  // самой вкладки "Дашборд".
  const PF_PERIOD_CONFIGS = {
    month: { keyOf: monthKeyOf, labelOf: monthLabelOf, allLabel: 'Все месяцы' },
    week: { keyOf: weekKeyOf, labelOf: weekLabelOf, allLabel: 'Все недели' },
    day: { keyOf: dayKeyOf, labelOf: dayLabelOf, allLabel: 'Все дни' },
  };

  // 01.09.2026: та же правка, что и на feed.html — топбар раньше всегда
  // показывал "Войти в EDGE", даже если человек уже залогинен в этом же
  // браузере. getSession() ничего не редиректит сама по себе, просто
  // красит топбар под реальное состояние. Дальше этот же session
  // используется ещё и для "Валюты отображения" (02.09.2026,
  // schema_milestone30.sql) — публичный профиль виден и анонимусам
  // (session тогда null), для них просто доллары по умолчанию.
  const { data: { session: viewerSession } } = await supabase.auth.getSession();
  if (viewerSession) {
    const area = document.getElementById('topbarAuthArea');
    area.innerHTML = `<span id="userEmail">…</span><button id="logoutBtn" type="button" style="margin-left:14px;">Выйти</button>`;
    initEmailPrivacyToggle(viewerSession.user.email);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.reload();
    });
  }
  const { currency: dispCurrency, rate: dispRate } = await getDisplayCurrency(supabase, viewerSession?.user?.id || null);
  const fm = (n) => fmtMoney(n, dispCurrency, dispRate);

  // Инициалы для аватара-заглушки, когда лого не загружено — до 2 букв,
  // из первых двух "слов" отображаемого имени (или username, если имени нет).
  function initialsOf(name) {
    const parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  const VERIFY_ICON_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 2.2 3.2-.6.9 3.1 3.1.9-.6 3.2L23 12l-2.2 2.4.6 3.2-3.1.9-.9 3.1-3.2-.6L12 23l-2.4-2.2-3.2.6-.9-3.1-3.1-.9.6-3.2L1 12l2.2-2.4-.6-3.2 3.1-.9.9-3.1 3.2.6L12 2z"/><path d="M8.5 12.2l2.4 2.4 4.6-5.2" stroke="var(--bg-card)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const VERIFY_ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><path d="M12 8v5" stroke-linecap="round"/><circle cx="12" cy="16" r="0.6" fill="currentColor" stroke="none"/></svg>';

  const params = new URLSearchParams(location.search);
  const username = (params.get('u') || '').trim().toLowerCase();
  const activeTab = params.get('tab') || 'bets';
  const keyParam = params.get('key');

  const profileHero = document.getElementById('profileHero');
  const publicTabs = document.getElementById('publicTabs');
  const tabRoot = document.getElementById('tabRoot');
  const footerCta = document.getElementById('footerCta');

  // Порядок вкладок: "Ставки" — первая и дефолтная (лента конкретных
  // постов, без цифр — не повторяет шапку профиля), "Дашборд" — намеренно
  // последняя, это более подробная сводка с полным набором карт статистики,
  // 4 из которых (Ставок/Винрейт/ROI/Профит) и так уже показаны в шапке
  // профиля выше. См. CHANGELOG.md — раньше "Дашборд" был первой и дефолтной
  // вкладкой, из-за чего эти 4 цифры сразу дублировались на экране.
  const TABS = [
    { id: 'bets', label: 'Ставки' },
    { id: 'disciplines', label: 'По дисциплинам' },
    { id: 'bookmakers', label: 'По букмекерам' },
    { id: 'markets', label: 'Рынки' },
    { id: 'teams', label: 'Команды' },
    { id: 'dashboard', label: 'Дашборд' },
  ];

  function notFound(message) {
    profileHero.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
  }

  if (!username) {
    notFound('Не указан профиль — ссылка неполная.');
  } else {
    const { data: profile, error: profileErr } = await supabase
      .from('profiles').select('*').eq('username', username).eq('is_public', true).maybeSingle();

    if (profileErr || !profile) {
      notFound('Такого публичного профиля не существует — либо ссылка устарела, либо владелец скрыл его.');
    } else {
      // "ruCount" — русское склонение числительных (1 ставка / 2 ставки / 5 ставок),
      // тот же helper, что и на дашборде в личном кабинете.
      const ruCount = (n, one, few, many) => {
        const m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return one;
        if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
        return many;
      };

      // ВАЖНО: RLS-политика "select public …" разрешает видеть строки ЛЮБОГО
      // пользователя с is_public = true, а не только этого профиля — поэтому
      // каждый запрос ниже обязательно фильтруется по user_id профиля явно,
      // иначе на публичной странице могли бы перемешаться данные разных
      // капперов, если публичных профилей станет больше одного.
      const uid = profile.user_id;
      const channel = profile.channel || 'cybervalue';
      const [{ data: bets, error: betsErr }, { data: withdrawals }, { data: settings }] = await Promise.all([
        supabase.from('bets').select('*').eq('user_id', uid).eq('channel', channel),
        supabase.from('withdrawals').select('*').eq('user_id', uid).eq('channel', channel),
        supabase.from('settings').select('*').eq('user_id', uid).eq('channel', channel).maybeSingle(),
      ]);

      if (betsErr) {
        tabRoot.innerHTML = `<div class="empty-state">Ошибка загрузки: ${escapeHtml(betsErr.message)}</div>`;
      } else {
        // 02.09.2026: "скрывать букмекеров по запросу" — settings.hidden_bookmakers
        // (bookmakers.html, schema_milestone31.sql). Маскируем ЗДЕСЬ, один раз,
        // до того как allBets попадёт в статистику/группировку/таблицу — так
        // проще, чем протаскивать список скрытых имён через каждую функцию
        // рендера отдельно, и ROI/винрейт/профит считаются как обычно (ставка
        // остаётся в счёте, скрывается только название конкретного букмекера).
        const hiddenBk = settings && Array.isArray(settings.hidden_bookmakers) ? settings.hidden_bookmakers : [];
        const allBets = (bets || []).map(b => hiddenBk.includes(b.bookmaker) ? { ...b, bookmaker: 'Скрыто' } : b);
        const allWithdrawals = withdrawals || [];
        const startingBankroll = settings ? settings.starting_bankroll : 0;

        publicTabs.style.display = '';
        publicTabs.innerHTML = `<div class="wrap">${TABS.map(t => `
          <a class="nav-pill${t.id === activeTab ? ' active' : ''}" href="public.html?u=${encodeURIComponent(username)}&tab=${t.id}">${escapeHtml(t.label)}</a>
        `).join('')}</div>`;

        const pageFile = `public.html?u=${encodeURIComponent(username)}&tab=${activeTab}`;
        const betsHref = `public.html?u=${encodeURIComponent(username)}&tab=bets`;

        // Считаем один раз здесь — используется и в шапке профиля (статы,
        // рейтинг), и во вкладке "Дашборд" ниже (renderPfCards/pfApplyFilter) —
        // но там уже с пересчётом под фильтр периода, не тот же самый s.
        const s = computeStats(allBets, allWithdrawals, startingBankroll);
        const rating = computeRatingTier(allBets);
        const specialization = computeSpecialization(allBets, 3);
        const isDiary = channel === 'default';
        const joinedLabel = profile.created_at
          ? monthYearGenitiveOf(profile.created_at)
          : null;

        const roleBadgesHtml = (profile.roles || []).map(r => {
          if (r === 'capper') return `<span class="pf-badge role-capper"><span class="dot"></span>Каппер</span>`;
          if (r === 'streamer') return `<span class="pf-badge role-streamer"><span class="dot"></span>Стример</span>`;
          return '';
        }).join('');
        const channelBadgeHtml = isDiary
          ? `<span class="pf-badge channel-type diary">Личный дневник</span>`
          : `<span class="pf-badge channel-type">Публичный канал</span>`;

        // 04.09.2026: карточки "Эта неделя"/"Этот месяц" (Вариант А, как на
        // приватном app.html над формой) — считаются здесь, ДО сборки
        // шапки, чтобы вставить их строкой внутри одного общего innerHTML
        // (по пожеланию пользователя — прямо между общей статистикой и
        // блоком дисциплин, а не отдельным элементом после всей шапки).
        const periodStatsHtml = (function () {
          const now = new Date();
          const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
          const curWeek = weekKeyOf(todayStr);
          const curMonth = monthKeyOf(todayStr);
          const weekBets = allBets.filter(b => weekKeyOf(b.bet_date) === curWeek);
          const monthBets = allBets.filter(b => monthKeyOf(b.bet_date) === curMonth);
          function periodCardHtml(title, periodBets) {
            const ps = computeStats(periodBets, [], 0);
            const flat = computeFlatStats(periodBets);
            const roiCls = ps.roi > 0 ? 'pos' : ps.roi < 0 ? 'neg' : '';
            const profitCls = ps.totalProfit > 0 ? 'pos' : ps.totalProfit < 0 ? 'neg' : '';
            const flatCls = flat.flatsProfit > 0 ? 'pos' : flat.flatsProfit < 0 ? 'neg' : '';
            return `
              <div class="period-stat-card">
                <div class="period-stat-title">${title}</div>
                <div class="period-stat-row">
                  <div class="period-stat-item"><span class="period-stat-val">${ps.total}</span><span class="period-stat-lbl">ставок</span></div>
                  <div class="period-stat-item"><span class="period-stat-val ${roiCls}">${ps.roi == null ? '—' : (ps.roi >= 0 ? '+' : '') + ps.roi.toFixed(1) + '%'}</span><span class="period-stat-lbl">ROI</span></div>
                  <div class="period-stat-item"><span class="period-stat-val ${profitCls}">${fm(ps.totalProfit)}</span><span class="period-stat-lbl">профит</span></div>
                  <div class="period-stat-item"><span class="period-stat-val ${flatCls}">${flat.flatsStaked ? (flat.flatsProfit >= 0 ? '+' : '') + flat.flatsProfit.toFixed(2) : '—'}</span><span class="period-stat-lbl">по флетам</span></div>
                </div>
              </div>`;
          }
          return `<div class="period-stats-block">${periodCardHtml('Эта неделя', weekBets)}${periodCardHtml('Этот месяц', monthBets)}</div>`;
        })();

        profileHero.innerHTML = `
          <div class="pf-banner">${renderProfileBanner(computeCardTrend('profit', allBets))}</div>
          <div class="pf-identity">
            <div class="pf-top">
              <div class="pf-avatar">${profile.logo_url ? `<img src="${escapeHtml(profile.logo_url)}" alt="">` : escapeHtml(initialsOf(profile.display_name || profile.username))}</div>
            </div>
            <div class="pf-name-row">
              <div class="pf-name">${escapeHtml(profile.display_name || profile.username)}</div>
              <span class="pf-verify${profile.is_verified ? '' : ' unverified'}" title="${profile.is_verified ? 'Верифицированный профиль' : 'Профиль не верифицирован'}">${profile.is_verified ? VERIFY_ICON_ON : VERIFY_ICON_OFF}</span>
            </div>
            <div class="pf-handle">@${escapeHtml(profile.username)}</div>
            <div class="pf-badges">${roleBadgesHtml}${channelBadgeHtml}</div>
            ${profile.bio ? `<div class="pf-bio">${escapeHtml(profile.bio)}</div>` : ''}
            <div class="pf-meta">
              ${joinedLabel ? `<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round"/></svg>На EDGE с ${joinedLabel}</span>` : ''}
              <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2" stroke-linecap="round"/></svg>${rating.closedCount} ${ruCount(rating.closedCount, 'закрытая ставка', 'закрытые ставки', 'закрытых ставок')}</span>
            </div>
            <div class="pf-stats">
              <div class="pf-stat"><div class="pf-stat-val">${s.total}</div><div class="pf-stat-lbl">Ставок</div></div>
              <div class="pf-stat"><div class="pf-stat-val">${s.winrate == null ? '—' : s.winrate.toFixed(1) + '%'}</div><div class="pf-stat-lbl">Винрейт</div></div>
              <div class="pf-stat"><div class="pf-stat-val ${s.roi > 0 ? 'pos' : s.roi < 0 ? 'neg' : ''}">${s.roi == null ? '—' : (s.roi >= 0 ? '+' : '') + s.roi.toFixed(1) + '%'}</div><div class="pf-stat-lbl">ROI</div></div>
              <div class="pf-stat"><div class="pf-stat-val ${s.totalProfit > 0 ? 'pos' : s.totalProfit < 0 ? 'neg' : ''}">${fm(s.totalProfit)}</div><div class="pf-stat-lbl">Профит</div></div>
            </div>
            ${periodStatsHtml}
            ${specialization.length ? `<div class="pf-spec">${specialization.map(sp => `<span class="pf-spec-chip"><span class="pf-spec-bar"><i style="width:${sp.pct}%"></i></span>${escapeHtml(sp.discipline)} <b>${sp.pct}%</b></span>`).join('')}</div>` : ''}
            <div class="pf-rating is-collapsed" id="pfRatingBox">
              <div class="pf-rating-head" id="pfRatingToggle" role="button" tabindex="0" aria-expanded="false" aria-controls="pfRatingBody">
                <div class="pf-rating-tier">${rating.tierName}</div>
                <div class="pf-rating-score">${rating.score} / 100<svg class="pf-rating-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
              <div class="pf-rating-body" id="pfRatingBody" hidden>
                <div class="pf-rating-track"><div class="pf-rating-fill" style="width:${rating.score}%"></div></div>
                <div class="pf-rating-ticks">${rating.tiers.map(t => `<span>${t}</span>`).join('')}</div>
                <div class="pf-rating-note">Сейчас грейд считается по количеству закрытых ставок — <b>${rating.closedCount}</b>, чем больше отслеженная история, тем выше рейтинг. В планах — добавить и другие факторы: стабильность серии, точность CLV, активность в канале и реакцию подписчиков.</div>
              </div>
            </div>
            <div class="trust-note" style="margin-top:16px;">
              <span class="trust-note-mark">⏱</span>
              <span>${(() => {
                const editedCount = allBets.filter(wasEditedAfterSettle).length;
                return editedCount
                  ? `${editedCount} ${ruCount(editedCount, 'ставка изменена', 'ставки изменены', 'ставок изменено')} после того, как исход уже был известен — наведи на «✎ изменено» в таблице, покажет, что именно поменяли.`
                  : 'Ни одна ставка не менялась после того, как исход уже был известен. Если это произойдёт — будет видно по бейджу «✎ изменено» в таблице, а не скрыто.';
              })()}</span>
            </div>
          </div>`;

        // 04.09.2026: блок рейтинга ("Новичок 15/100" + трек + описание) по
        // отзыву пользователя "портит вид" на первом экране — сворачиваем по
        // умолчанию, остаётся видна только шапка (тир + счёт), трек/тики/
        // текст-пояснение раскрываются по клику на неё же (или Enter/Space
        // — role="button" вместо <button>, чтобы не тащить сюда стили кнопки
        // поверх готовой разметки .pf-rating-head).
        (function initRatingToggle() {
          const toggle = document.getElementById('pfRatingToggle');
          const body = document.getElementById('pfRatingBody');
          const box = document.getElementById('pfRatingBox');
          if (!toggle || !body) return;
          function setExpanded(expanded) {
            body.hidden = !expanded;
            toggle.setAttribute('aria-expanded', String(expanded));
            if (box) box.classList.toggle('is-collapsed', !expanded);
          }
          toggle.addEventListener('click', () => setExpanded(body.hidden));
          toggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setExpanded(body.hidden); }
          });
        })();

        function renderPfCards(bets, s2, isFiltered) {
          const flatStats = computeFlatStats(bets);
          const cards = [
            { label: 'Всего ставок', value: s2.total, sub: '', href: betsHref, pop: () => renderSparkline(computeCardTrend('total', bets)) },
            { label: 'В игре', value: s2.pending, cls: s2.pending ? 'pos' : '', sub: s2.pending ? 'ждут результата' : '', href: betsHref },
            { label: 'W / L / P', value: renderWLP(s2.wins, s2.losses, s2.pushes), sub: '', href: betsHref, pop: () => renderWlpBars(s2.wins, s2.losses, s2.pushes) },
            { label: 'Винрейт', value: s2.winrate == null ? '—' : s2.winrate.toFixed(1) + '%', sub: (s2.wins + s2.losses) ? `${s2.wins + s2.losses} решённых` : '', href: betsHref, pop: () => renderSparkline(computeCardTrend('winrate', bets)) },
            { label: 'Профит', value: fm(s2.totalProfit), cls: s2.totalProfit > 0 ? 'pos' : s2.totalProfit < 0 ? 'neg' : '', sub: '', href: betsHref, pop: () => renderSparkline(computeCardTrend('profit', bets)) },
            { label: 'ROI', value: s2.roi == null ? '—' : s2.roi.toFixed(2) + '%', cls: s2.roi > 0 ? 'pos' : s2.roi < 0 ? 'neg' : '', sub: '', href: betsHref, pop: () => renderSparkline(computeCardTrend('roi', bets)) },
            { label: 'Средний кэф', value: s2.avgOdds == null ? '—' : s2.avgOdds.toFixed(2), sub: '', href: betsHref, pop: () => renderTopBetsPop(bets, 3, dispCurrency, dispRate) },
            // Профит по флетам — см. подробный комментарий у
            // computeFlatStats/computeProfitInFlats в lib.js. Сырое
            // количество флетов, а не доходность в процентах (см. ту же
            // правку в dashboard.html).
            { label: 'Профит по флетам', value: flatStats.flatsStaked ? `${flatStats.flatsProfit >= 0 ? '+' : ''}${flatStats.flatsProfit.toFixed(2)}` : '—', cls: flatStats.flatsProfit > 0 ? 'pos' : flatStats.flatsProfit < 0 ? 'neg' : '', sub: flatStats.flatsStaked ? `из ${flatStats.flatsStaked.toFixed(2)} флета` : '', href: betsHref, pop: () => renderSparkline(computeCardTrend('flatsProfit', bets)) },
          ];
          // "Средний кэф" вернули обратно (30.08.2026, по прямой просьбе —
          // на публичной сводке этой карточки не хватало, пустое место в
          // сетке смотрелось как недоделка). Раньше специально убирался
          // отсюда, чтобы не дублировать его же в детальных таблицах — но
          // там он виден только после перехода в разбивку, здесь же это
          // единственное место, где среднюю доходность кэфа видно сразу на
          // сводке, так что дублирования по сути нет.
          // "Текущая серия" — компактная версия того же блока, что на
          // приватном дашборде показывает полосу точек: здесь, в формате
          // обычной карточки сетки, только заголовок серии текстом
          // (computeStreak уже используется на этой странице для рейтинга
          // капперов, тут — тот же расчёт, другое представление).
          {
            const streak = computeStreak(bets, 10);
            const streakLabel = streak.streakType == null ? 'Нет серии'
              : streak.streakType === 'W' ? `${streak.streakLen} ${ruCount(streak.streakLen, 'победа', 'победы', 'побед')}`
              : `${streak.streakLen} ${ruCount(streak.streakLen, 'поражение', 'поражения', 'поражений')}`;
            cards.push({
              label: 'Текущая серия',
              value: streakLabel,
              cls: streak.streakType === 'W' ? 'pos' : streak.streakType === 'L' ? 'neg' : '',
              sub: streak.streakType == null ? '' : 'подряд',
              href: betsHref,
            });
          }
          // Milestone 13: банк/прирост банка на публичном профиле — только
          // если владелец сам включил show_bank (по умолчанию скрыто).
          // s2 (не глобальный s) — та же логика, что и на dashboard.html:
          // "Банк"/"Прирост банка" реагируют на период-фильтр через профит
          // (startingBankroll + профит ФИЛЬТРА - все выводы целиком), это
          // уже так себя ведёт на приватном дашборде, просто переносим 1:1.
          if (profile.show_bank) {
            cards.push(
              { label: 'Банк', value: fm(s2.currentBank), cls: s2.currentBank > s2.startingBankroll ? 'pos' : s2.currentBank < s2.startingBankroll ? 'neg' : '', sub: `старт ${fm(s2.startingBankroll)}`, pop: () => renderSparkline(computeCardTrend('bank', bets, allWithdrawals, startingBankroll)) },
              { label: 'Прирост банка', value: s2.bankGrowthPct == null ? '—' : s2.bankGrowthPct.toFixed(1) + '%', cls: s2.bankGrowthPct > 0 ? 'pos' : s2.bankGrowthPct < 0 ? 'neg' : '', sub: fm(s2.totalProfit) + ' по ставкам', pop: () => renderSparkline(computeCardTrend('growth', bets, allWithdrawals, startingBankroll)) },
            );
          }
          // Сетка — 3 колонки. Раньше здесь ещё дорисовывались пустые
          // карточки-заглушки, когда число карточек не делилось на 3 ровно
          // (иначе в старой версии .stat-grid, рисовавшей разделители через
          // собственный background+gap:1px, в такой пустой ячейке
          // просвечивал сплошной серый прямоугольник). В EDGE 3.0
          // (styles-edge3.css) у .stat-grid этот фон убран
          // (background:transparent, разделители — border каждой отдельной
          // карточки), просвечивать больше нечему — настоящая незаполненная
          // ячейка в конце строки теперь просто пустое место. Поэтому
          // заглушки убраны: см. тот же комментарий подробнее в
          // dashboard.html (renderStats).
          // id="statGrid" — тот же селектор, что в styles-edge3.css даёт
          // приватному дашборду hover-эффект (укрупнение карточки + раскрытие
          // .stat-card-pop-content с мини-графиком); data-has-pop + сама
          // разметка ниже воспроизводят паттерн dashboard.html, чтобы
          // публичный профиль вёл себя так же при наведении.
          const statHtml = `<div class="stat-grid stat-grid-3" id="statGrid">${cards.map(c => {
            const tag = c.href ? 'a' : 'div';
            const hrefAttr = c.href ? ` href="${c.href}"` : '';
            const hasPopAttr = c.pop ? ' data-has-pop' : '';
            return `
            <${tag} class="stat-card"${hrefAttr}${hasPopAttr}>
              <div class="stat-label">${c.label}</div>
              <div class="stat-value ${c.cls || ''}">${c.value}</div>
              ${c.sub ? `<div class="stat-sub">${c.sub}</div>` : ''}
              ${c.pop ? `<div class="stat-card-pop-content" hidden>
                <div class="stat-spark-pop-title">${c.label}</div>
                ${c.pop()}
              </div>` : ''}
            </${tag}>`;
          }).join('')}</div>`;

          const { recent, streakType, streakLen } = computeStreak(bets, 10);
          let streakHtml = '';
          if (recent.length) {
            const cls = streakType === 'W' ? 'pos' : streakType === 'L' ? 'neg' : 'neu';
            const headline = streakType == null ? 'Нет активной серии'
              : streakType === 'W' ? `${streakLen} ${ruCount(streakLen, 'победа', 'победы', 'побед')} подряд`
              : `${streakLen} ${ruCount(streakLen, 'поражение', 'поражения', 'поражений')} подряд`;
            const dots = recent.map((r, i) => {
              const dotCls = r.outcome === 'W' ? 'w' : r.outcome === 'L' ? 'l' : 'p';
              const isLast = i === recent.length - 1;
              const dateLabel = r.bet.bet_date ? r.bet.bet_date.split('-').reverse().join('.') : '';
              return `<span class="streak-dot ${dotCls}${isLast ? ' last' : ''}" title="${dateLabel}: ${r.outcome === 'W' ? 'Win' : r.outcome === 'L' ? 'Loss' : 'Push'}"></span>`;
            }).join('');
            streakHtml = `
              <div class="streak-block">
                <div class="streak-info">
                  <div class="streak-label">Текущая серия</div>
                  <div class="streak-value ${cls}">${headline}</div>
                  <div class="streak-sub">по последним ${recent.length} ${ruCount(recent.length, 'сыгранной ставке', 'сыгранным ставкам', 'сыгранным ставкам')}</div>
                </div>
                <div class="streak-dots">${dots}</div>
              </div>`;
          }
          const emptyNote = bets.length === 0
            ? (isFiltered
                ? `<div class="empty-state">Ставок за выбранный период не найдено.</div>`
                : `<div class="empty-state">В этом канале пока нет ставок — они появятся здесь по мере публикации.</div>`)
            : '';
          return statHtml + streakHtml + emptyNote;
        }

        // Фильтр по периоду (02.09.2026) — та же гранулярность День/Неделя/
        // Месяц, что и на приватном dashboard.html, только без фильтра по
        // турниру (тут не запрашивали, не плодим лишний контрол).
        const pfPeriodConfig = () => PF_PERIOD_CONFIGS[document.getElementById('pfPeriodType')?.value] || PF_PERIOD_CONFIGS.month;
        function pfPopulatePeriodOptions(keepValue) {
          const sel = document.getElementById('pfPeriod');
          if (!sel) return;
          const cfg = pfPeriodConfig();
          const keys = Array.from(new Set(allBets.map(b => cfg.keyOf(b.bet_date)).filter(Boolean))).sort().reverse();
          sel.innerHTML = `<option value="">${cfg.allLabel}</option>` + keys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(cfg.labelOf(k))}</option>`).join('');
          if (keepValue && keys.includes(keepValue)) sel.value = keepValue;
        }
        function pfApplyFilter() {
          const grid = document.getElementById('pfStatGrid');
          if (!grid) return;
          const per = document.getElementById('pfPeriod').value;
          const cfg = pfPeriodConfig();
          const isFiltered = !!per;
          const filtered = per ? allBets.filter(b => cfg.keyOf(b.bet_date) === per) : allBets;
          const s2 = computeStats(filtered, allWithdrawals, startingBankroll);
          grid.innerHTML = renderPfCards(filtered, s2, isFiltered);
          initStatCardPopovers(document.getElementById('statGrid'));
        }

        function renderBreakdownTab(labelHeader, groups, keyLabel2, hideBookmakerCol) {
          if (keyParam) {
            const group = groups.find(g => g.key === keyParam);
            return renderBreakdownDetail(labelHeader, keyParam, group, pageFile, !!hideBookmakerCol, dispCurrency, dispRate);
          }
          return renderGroupCards(groups, labelHeader, pageFile, dispCurrency, dispRate);
        }

        let html = '';
        switch (activeTab) {
          case 'bets':
            html = renderBetsFlatTable(allBets, { currency: dispCurrency, rate: dispRate });
            break;
          case 'disciplines':
            html = renderBreakdownTab('Дисциплина', groupBets(allBets, b => b.discipline));
            break;
          case 'bookmakers':
            html = renderBreakdownTab('Букмекер', groupBets(allBets, b => b.bookmaker), null, true);
            break;
          case 'markets':
            html = renderBreakdownTab('Рынок', groupBets(allBets, classifyMarket));
            break;
          case 'teams':
            html = renderBreakdownTab('Команда', groupBetsMulti(allBets, teamKeysForBet));
            break;
          case 'dashboard':
          default:
            html = `
              <div class="pf-period-filter">
                <select id="pfPeriodType">
                  <option value="month">Месяц</option>
                  <option value="week">Неделя</option>
                  <option value="day">День</option>
                </select>
                <select id="pfPeriod"></select>
              </div>
              <div id="pfStatGrid"></div>`;
            break;
        }
        tabRoot.innerHTML = html;
        footerCta.style.display = '';
        if (activeTab === 'dashboard') {
          pfPopulatePeriodOptions(null);
          pfApplyFilter();
          document.getElementById('pfPeriod').addEventListener('change', pfApplyFilter);
          document.getElementById('pfPeriodType').addEventListener('change', () => { pfPopulatePeriodOptions(null); pfApplyFilter(); });
        }
      }
    }
  }
</script>

</body>
</html>
