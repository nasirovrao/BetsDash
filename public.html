<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Публичный профиль — EDGE</title>
<meta name="description" content="Публичный, верифицируемый профиль ставок на EDGE — метки времени на каждой записи, без правок задним числом.">
<!--
  ВАЖНО про эти og/twitter-теги: страница рендерится на клиенте (JS
  подставляет имя каппера, статы и т.д. уже В БРАУЗЕРЕ), а боты соцсетей
  (Telegram/VK/Facebook/Discord…), которые генерируют превью ссылки, обычно
  JS не выполняют — они читают только то, что есть в исходном HTML. Поэтому
  превью ниже ОБЩИЕ для всех капперов/каналов, а не персональные (не покажет
  конкретно имя и лого Cybervalue) — таковы ограничения чисто статического
  хостинга без сервера. Настоящее персональное превью на канал потребовало
  бы отдельной серверной функции, которая подставляет теги до отдачи HTML
  ботам — это можно сделать позже, но не в рамках голого статического сайта.
  og:image указан ОТНОСИТЕЛЬНЫМ путём специально — тогда он одинаково
  корректно резолвится и на текущем github.io-адресе, и после переезда на
  свой домен, без правки кода.
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="EDGE">
<meta property="og:title" content="Публичный профиль ставок — EDGE">
<meta property="og:description" content="Верифицируемый трек-рекорд ставок: метки времени на каждой записи, без правок задним числом.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Публичный профиль ставок — EDGE">
<meta name="twitter:description" content="Верифицируемый трек-рекорд ставок: метки времени на каждой записи, без правок задним числом.">
<meta name="twitter:image" content="og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=29">
<!-- EDGE 2.0 — новая дизайн-система (палитра/типографика/фон), см. styles-edge2.css -->
<link rel="stylesheet" href="styles-edge2.css?v=1">
<link rel="stylesheet" href="styles-edge3.css?v=1">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <!-- Новый знак — кольцо (базовая дуга приглушённая + яркий акцент —
         "твой эдж", как progress-ring) с буквой E внутри, вместо ромба,
         который совпадал по силуэту с Ethereum. -->
    <a class="brand" href="index.html"><svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--gold)" stroke-width="1.6" opacity="0.28"/><path d="M16 4 A12 12 0 0 1 26.9 12.3" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/><line x1="12" y1="12" x2="12" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="12" x2="19" y2="12" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="16" x2="17.5" y2="16" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/><line x1="12" y1="20" x2="19" y2="20" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/></svg>EDGE<span>.</span></a>
    <div class="topbar-user">
      <a class="topbar-link" href="index.html">Войти в EDGE</a>
    </div>
  </div>
</div>

<section>
  <div class="wrap">
    <div id="profileHero"><div class="empty-state">Загружаю…</div></div>
    <nav class="app-nav public-tabs" id="publicTabs" style="display:none;"></nav>
    <div id="tabRoot"></div>
  </div>
</section>

<div class="public-footer-cta" id="footerCta" style="display:none;">
  <div class="wrap">
    <span>Хочешь такой же публичный, верифицируемый профиль ставок?</span>
    <a class="btn btn-primary" href="index.html" style="width:auto;">Начать в EDGE →</a>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase-client.js';
  import {
    fmtMoney, computeStats, computeStreak, renderWLP, escapeHtml,
    groupBets, groupBetsMulti, renderGroupCards, renderBreakdownDetail,
    classifyMarket, teamKeysForBet,
  } from './lib.js';

  const params = new URLSearchParams(location.search);
  const username = (params.get('u') || '').trim().toLowerCase();
  const activeTab = params.get('tab') || 'dashboard';
  const keyParam = params.get('key');

  const profileHero = document.getElementById('profileHero');
  const publicTabs = document.getElementById('publicTabs');
  const tabRoot = document.getElementById('tabRoot');
  const footerCta = document.getElementById('footerCta');

  const TABS = [
    { id: 'dashboard', label: 'Дашборд' },
    { id: 'disciplines', label: 'По дисциплинам' },
    { id: 'bookmakers', label: 'По букмекерам' },
    { id: 'markets', label: 'Рынки' },
    { id: 'teams', label: 'Команды' },
  ];

  function notFound(message) {
    profileHero.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
  }

  if (!username) {
    notFound('Не указан профиль — ссылка неполная.');
  } else {
    const { data: profile, error: profileErr } = await supabase
      .from('profiles').select('*').eq('username', username).eq('is_public', true).maybeSingle();

    if (profileErr || !profile) {
      notFound('Такого публичного профиля не существует — либо ссылка устарела, либо владелец скрыл его.');
    } else {
      // "ruCount" — русское склонение числительных (1 ставка / 2 ставки / 5 ставок),
      // тот же helper, что и на дашборде в личном кабинете.
      const ruCount = (n, one, few, many) => {
        const m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return one;
        if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
        return many;
      };

      profileHero.innerHTML = `
        <div class="profile-hero">
          <div class="profile-hero-top">
            ${profile.logo_url ? `<img class="profile-hero-logo" src="${escapeHtml(profile.logo_url)}" alt="${escapeHtml(profile.display_name || profile.username)}">` : ''}
            <div class="profile-hero-headline">
              <div class="profile-hero-name">${escapeHtml(profile.display_name || profile.username)}</div>
              <span class="profile-badge">Публичный профиль · верифицированные данные</span>
            </div>
          </div>
          ${profile.bio ? `<div class="profile-hero-bio">${escapeHtml(profile.bio)}</div>` : ''}
          <div class="trust-note">
            <span class="trust-note-mark">⏱</span>
            <span>Правки задним числом видно: наведи на «✎ изменено» в таблице — покажет, что именно поменяли.</span>
          </div>
        </div>`;

      // ВАЖНО: RLS-политика "select public …" разрешает видеть строки ЛЮБОГО
      // пользователя с is_public = true, а не только этого профиля — поэтому
      // каждый запрос ниже обязательно фильтруется по user_id профиля явно,
      // иначе на публичной странице могли бы перемешаться данные разных
      // капперов, если публичных профилей станет больше одного.
      const uid = profile.user_id;
      const channel = profile.channel || 'cybervalue';
      const [{ data: bets, error: betsErr }, { data: withdrawals }, { data: settings }] = await Promise.all([
        supabase.from('bets').select('*').eq('user_id', uid).eq('channel', channel),
        supabase.from('withdrawals').select('*').eq('user_id', uid).eq('channel', channel),
        supabase.from('settings').select('*').eq('user_id', uid).eq('channel', channel).maybeSingle(),
      ]);

      if (betsErr) {
        tabRoot.innerHTML = `<div class="empty-state">Ошибка загрузки: ${escapeHtml(betsErr.message)}</div>`;
      } else {
        const allBets = bets || [];
        const allWithdrawals = withdrawals || [];
        const startingBankroll = settings ? settings.starting_bankroll : 0;

        publicTabs.style.display = '';
        publicTabs.innerHTML = `<div class="wrap">${TABS.map(t => `
          <a class="nav-pill${t.id === activeTab ? ' active' : ''}" href="public.html?u=${encodeURIComponent(username)}&tab=${t.id}">${escapeHtml(t.label)}</a>
        `).join('')}</div>`;

        const pageFile = `public.html?u=${encodeURIComponent(username)}&tab=${activeTab}`;

        function renderDashboardTab() {
          const s = computeStats(allBets, allWithdrawals, startingBankroll);
          const cards = [
            { label: 'Всего ставок', value: s.total, sub: '' },
            { label: 'В игре', value: s.pending, cls: s.pending ? 'pos' : '', sub: s.pending ? 'ждут результата' : '' },
            { label: 'W / L / P', value: renderWLP(s.wins, s.losses, s.pushes), sub: '' },
            { label: 'Винрейт', value: s.winrate == null ? '—' : s.winrate.toFixed(1) + '%', sub: (s.wins + s.losses) ? `${s.wins + s.losses} решённых` : '' },
            { label: 'Профит', value: fmtMoney(s.totalProfit), cls: s.totalProfit > 0 ? 'pos' : s.totalProfit < 0 ? 'neg' : '', sub: '' },
            { label: 'ROI', value: s.roi == null ? '—' : s.roi.toFixed(2) + '%', cls: s.roi > 0 ? 'pos' : s.roi < 0 ? 'neg' : '', sub: '' },
          ];
          // "Средний кэф" сознательно убран отсюда (был здесь): без банка
          // это давало 7 карточек — не делится ровно на 3 колонки, снизу
          // висела дополнительная пустая ячейка-заглушка (см. padCount
          // ниже). 6 карточек делятся ровно, заглушки не нужны вовсе.
          // Сама метрика никуда не делась — она есть в детальных таблицах
          // по ставкам, просто не дублируется на публичной сводке.
          // Milestone 13: банк/прирост банка на публичном профиле — только
          // если владелец сам включил show_bank (по умолчанию скрыто).
          if (profile.show_bank) {
            cards.push(
              { label: 'Банк', value: fmtMoney(s.currentBank), cls: s.currentBank > s.startingBankroll ? 'pos' : s.currentBank < s.startingBankroll ? 'neg' : '', sub: `старт ${fmtMoney(s.startingBankroll)}` },
              { label: 'Прирост банка', value: s.bankGrowthPct == null ? '—' : s.bankGrowthPct.toFixed(1) + '%', cls: s.bankGrowthPct > 0 ? 'pos' : s.bankGrowthPct < 0 ? 'neg' : '', sub: fmtMoney(s.totalProfit) + ' по ставкам' },
            );
          }
          // Сетка — 3 колонки, число карточек должно ровно делиться на 3,
          // иначе в последнем ряду проступает пустой серый прямоугольник —
          // ЭТО НЕ фон недостающей ячейки, а .stat-grid's собственный
          // background:var(--line) (та же переменная, что рисует тонкие
          // разделительные линии между карточками через gap:1px) — он
          // просвечивает на всю площадь ячейки, если её не перекрыть чем-то
          // непрозрачным. `visibility:hidden` на заглушке НЕ решает это: сам
          // элемент не красится, но и не перекрывает фон родителя — то есть
          // именно так и получается сплошной серый прямоугольник на месте
          // "невидимой" заглушки. Поэтому заглушка красится как обычная
          // карточка (bg-card), просто без содержимого — визуально пустая
          // ячейка в тон остальным, а не цветная плашка.
          const padCount = (3 - cards.length % 3) % 3;
          const statHtml = `<div class="stat-grid stat-grid-3">${cards.map(c => `
            <div class="stat-card">
              <div class="stat-label">${c.label}</div>
              <div class="stat-value ${c.cls || ''}">${c.value}</div>
              ${c.sub ? `<div class="stat-sub">${c.sub}</div>` : ''}
            </div>`).join('')}${'<div class="stat-card" aria-hidden="true"></div>'.repeat(padCount)}</div>`;

          const { recent, streakType, streakLen } = computeStreak(allBets, 10);
          let streakHtml = '';
          if (recent.length) {
            const cls = streakType === 'W' ? 'pos' : streakType === 'L' ? 'neg' : 'neu';
            const headline = streakType == null ? 'Нет активной серии'
              : streakType === 'W' ? `${streakLen} ${ruCount(streakLen, 'победа', 'победы', 'побед')} подряд`
              : `${streakLen} ${ruCount(streakLen, 'поражение', 'поражения', 'поражений')} подряд`;
            const dots = recent.map((r, i) => {
              const dotCls = r.outcome === 'W' ? 'w' : r.outcome === 'L' ? 'l' : 'p';
              const isLast = i === recent.length - 1;
              const dateLabel = r.bet.bet_date ? r.bet.bet_date.split('-').reverse().join('.') : '';
              return `<span class="streak-dot ${dotCls}${isLast ? ' last' : ''}" title="${dateLabel}: ${r.outcome === 'W' ? 'Win' : r.outcome === 'L' ? 'Loss' : 'Push'}"></span>`;
            }).join('');
            streakHtml = `
              <div class="streak-block">
                <div class="streak-info">
                  <div class="streak-label">Текущая серия</div>
                  <div class="streak-value ${cls}">${headline}</div>
                  <div class="streak-sub">по последним ${recent.length} ${ruCount(recent.length, 'сыгранной ставке', 'сыгранным ставкам', 'сыгранным ставкам')}</div>
                </div>
                <div class="streak-dots">${dots}</div>
              </div>`;
          }
          const emptyNote = s.total === 0
            ? `<div class="empty-state">В этом канале пока нет ставок — они появятся здесь по мере публикации.</div>` : '';
          return statHtml + streakHtml + emptyNote;
        }

        function renderBreakdownTab(labelHeader, groups, keyLabel2, hideBookmakerCol) {
          if (keyParam) {
            const group = groups.find(g => g.key === keyParam);
            return renderBreakdownDetail(labelHeader, keyParam, group, pageFile, !!hideBookmakerCol);
          }
          return renderGroupCards(groups, labelHeader, pageFile);
        }

        let html = '';
        switch (activeTab) {
          case 'disciplines':
            html = renderGroupCards(groupBets(allBets, b => b.discipline), 'Дисциплина');
            break;
          case 'bookmakers':
            html = renderBreakdownTab('Букмекер', groupBets(allBets, b => b.bookmaker), null, true);
            break;
          case 'markets':
            html = renderBreakdownTab('Рынок', groupBets(allBets, classifyMarket));
            break;
          case 'teams':
            html = renderBreakdownTab('Команда', groupBetsMulti(allBets, teamKeysForBet));
            break;
          case 'dashboard':
          default:
            html = renderDashboardTab();
            break;
        }
        tabRoot.innerHTML = html;
        footerCta.style.display = '';
      }
    }
  }
</script>

</body>
</html>
