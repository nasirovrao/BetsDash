<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рынки — EDGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M16 2L28 12L22 30H10L4 12Z" fill="var(--gold)" opacity="0.16"/><path d="M16 2L28 12L16 18L4 12Z" fill="var(--gold)"/><path d="M16 18L28 12L22 30H16Z" fill="var(--gold)" opacity="0.55"/><path d="M16 18L4 12L10 30H16Z" fill="var(--gold)" opacity="0.75"/></svg>EDGE<span>.</span></div>
    <div class="topbar-user">
      <span id="userEmail">…</span>
      <button id="logoutBtn" type="button">Выйти</button>
    </div>
  </div>
</div>

<nav class="app-nav">
  <div class="wrap">
    <a class="nav-pill" href="dashboard.html">Дашборд</a>
    <a class="nav-pill" href="app.html">Ставки</a>
    <a class="nav-pill" href="bank.html">Выводы и банк</a>
    <a class="nav-pill" href="disciplines.html">По дисциплинам</a>
    <a class="nav-pill" href="bookmakers.html">По букмекерам</a>
    <a class="nav-pill active" href="markets.html">Рынки</a>
    <a class="nav-pill" href="teams.html">Команды</a>
    <a class="nav-pill" href="segmentation.html">Сегментация</a>
    <a class="nav-pill" href="edges.html">Найденные эджи</a>
  </div>
</nav>

<section>
  <div class="wrap">
    <div class="section-head">
      <h2>Рынки</h2>
      <div class="section-note">Тип рынка определяется автоматически по тексту пика.</div>
    </div>
    <div id="breakdownRoot"><div class="empty-state">Загружаю…</div></div>
  </div>
</section>

<script type="module">
  import { supabase, requireSession } from './supabase-client.js';
  import { groupBets, renderGroupTable, classifyMarket } from './lib.js';

  const session = await requireSession();
  if (session) {
    document.getElementById('userEmail').textContent = session.user.email;
  }
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  const root = document.getElementById('breakdownRoot');

  const { data, error } = await supabase.from('bets').select('*');
  if (error) {
    root.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
  } else {
    const groups = groupBets(data, classifyMarket);
    root.innerHTML = renderGroupTable(groups, 'Рынок');
  }
</script>

</body>
</html>
