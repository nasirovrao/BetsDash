<section>
  <div class="wrap">
    <div class="section-head">
      <h2>Сегментация</h2>
      <div class="section-note">Разбивка по типу ставки.</div>
    </div>

    <div id="channelSwitch"></div>

    <div class="breakdown-block">
      <h3>Тип ставки</h3>
      <div id="byTypeRoot"><div class="empty-state">Загружаю…</div></div>
    </div>
  </div>
</section>

<script type="module">
  import { supabase, requireSession, isClvEnabled } from './supabase-client.js';
  import { groupBets, renderGroupCards, renderBreakdownDetail, getChannelParams, loadMyChannels, renderChannelSwitch, preserveChannelInNav, channelHref, initEmailPrivacyToggle, initNavDropdown} from './lib.js';

  const session = await requireSession();
  if (session) {
    initEmailPrivacyToggle(session.user.email);
    initNavDropdown('statsDropdown');
    initNavDropdown('settingsDropdown');
  }
  isClvEnabled().then(on => { if (on) document.getElementById('navClvPill').style.display = ''; });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  const { channel: activeChannel, owner: ownerParam } = getChannelParams();
  const ownerUserId = ownerParam || session.user.id;
  preserveChannelInNav(activeChannel, ownerUserId, session.user.id);
  const pageFile = channelHref('segmentation.html', activeChannel, ownerUserId, session.user.id);

  loadMyChannels(supabase, session.user.id).then(channels => {
    document.getElementById('channelSwitch').innerHTML =
      renderChannelSwitch(channels, activeChannel, ownerUserId, 'segmentation.html');
  });

  const byTypeRoot = document.getElementById('byTypeRoot');
  const keyParam = new URLSearchParams(location.search).get('key');

  // Разбивка по уверенности временно убрана — оставили пока только тип ставки.
  const { data, error } = await supabase.from('bets').select('*').eq('user_id', ownerUserId).eq('channel', activeChannel);
  if (error) {
    byTypeRoot.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
  } else {
    const byType = groupBets(data, b => b.bet_type);
    if (keyParam) {
      const group = byType.find(g => g.key === keyParam);
      byTypeRoot.innerHTML = renderBreakdownDetail('Тип ставки', keyParam, group, pageFile);
    } else {
      byTypeRoot.innerHTML = renderGroupCards(byType, 'Тип ставки', pageFile);
    }
  }
</script>
