<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сегментация — EDGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="dashboard.html"><svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path d="M16 2L28 12L22 30H10L4 12Z" fill="var(--gold)" opacity="0.16"/><path d="M16 2L28 12L16 18L4 12Z" fill="var(--gold)"/><path d="M16 18L28 12L22 30H16Z" fill="var(--gold)" opacity="0.55"/><path d="M16 18L4 12L10 30H16Z" fill="var(--gold)" opacity="0.75"/></svg>EDGE<span>.</span></a>
    <div class="topbar-user">
      <span id="userEmail">…</span>
      <button id="logoutBtn" type="button">Выйти</button>
    </div>
  </div>
</div>

<nav class="app-nav">
  <div class="wrap">
    <a class="nav-pill" href="dashboard.html">Дашборд</a>
    <a class="nav-pill" href="app.html">Ставки</a>
    <a class="nav-pill" href="bank.html">Выводы и банк</a>
    <a class="nav-pill" href="disciplines.html">По дисциплинам</a>
    <a class="nav-pill" href="bookmakers.html">По букмекерам</a>
    <a class="nav-pill" href="markets.html">Рынки</a>
    <a class="nav-pill" href="teams.html">Команды</a>
    <a class="nav-pill active" href="segmentation.html">Сегментация</a>
    <a class="nav-pill" href="edges.html">Найденные эджи</a>
    <a class="nav-pill" id="navClvPill" href="clv.html" style="display:none;">CLV Tracker</a>
  </div>
</nav>

<section>
  <div class="wrap">
    <div class="section-head">
      <h2>Сегментация</h2>
      <div class="section-note">Разбивка по типу ставки и по уверенности.</div>
    </div>

    <div class="breakdown-block">
      <h3>Тип ставки</h3>
      <div id="byTypeRoot"><div class="empty-state">Загружаю…</div></div>
    </div>

    <div class="breakdown-block">
      <h3>Уверенность</h3>
      <div id="byConvictionRoot"><div class="empty-state">Загружаю…</div></div>
    </div>
  </div>
</section>

<script type="module">
  import { supabase, requireSession, isClvEnabled } from './supabase-client.js';
  import { groupBets, renderGroupCards } from './lib.js';

  const session = await requireSession();
  if (session) {
    document.getElementById('userEmail').textContent = session.user.email;
  }
  isClvEnabled().then(on => { if (on) document.getElementById('navClvPill').style.display = ''; });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  const byTypeRoot = document.getElementById('byTypeRoot');
  const byConvictionRoot = document.getElementById('byConvictionRoot');

  const { data, error } = await supabase.from('bets').select('*');
  if (error) {
    byTypeRoot.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
    byConvictionRoot.innerHTML = '';
  } else {
    const byType = groupBets(data, b => b.bet_type);
    byTypeRoot.innerHTML = renderGroupCards(byType, 'Тип ставки');

    const byConviction = groupBets(data, b => b.conviction ? '★'.repeat(Number(b.conviction)) : null);
    byConvictionRoot.innerHTML = renderGroupCards(byConviction, 'Уверенность');
  }
</script>

</body>
</html>
